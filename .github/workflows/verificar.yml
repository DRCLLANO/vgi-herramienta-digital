# Verificación automática de VGI Digital.
# Corre las cuatro pruebas del directorio verificacion/ cada vez que llega un
# cambio a main o se abre una solicitud de cambios (pull request). Si alguna
# falla, la ejecución queda en rojo y, con la rama main protegida, el cambio
# no se puede fusionar. No publica nada ni modifica el repositorio.
name: Verificar VGI Digital

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Pruebas de la aplicación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Playwright y Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Correr las pruebas
        run: npm test

      - name: Guardar los resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-verificacion
          path: resultados/
          retention-days: 90
