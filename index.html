mos:{
  eje:'social', dom:'Apoyo social',
  name:'MOS',
  full:'Cuestionario MOS de apoyo social',
  blurb:'Instrumento breve y autoadministrado que evalúa cinco componentes del apoyo social percibido.',
  max:95,
  ref:'Sherbourne CD, Stewart AL. Soc Sci Med. 1991;32(6):705-14. Validación colombiana: Londoño Arredondo NH, Rogers H, Castilla Tang JF, Posada Gómez S, Ochoa Arizal N, Jaramillo Pérez MA, et al. Int J Psychol Res. 2012;5(1):142-50.',
  scaleOpts:[
    {l:'1 · Nunca',v:1},
    {l:'2 · Pocas veces',v:2},
    {l:'3 · Algunas veces',v:3},
    {l:'4 · La mayoría de las veces',v:4},
    {l:'5 · Siempre',v:5}
  ],
  qs:[
    'Que le ayude cuando tenga que estar en la cama',
    'Con quien pueda contar cuando necesite hablar',
    'Que le aconseje cuando tenga problemas',
    'Que le lleve al médico cuando lo necesite',
    'Que le muestre amor y afecto',
    'Con quien pasar un buen rato',
    'Que le informe y ayude a entender la situación',
    'En quién confiar o con quién hablar de sí mismo y sus preocupaciones',
    'Que le abrace',
    'Con quien pueda relajarse',
    'Que le prepare la comida si no puede hacerlo',
    'Cuyo consejo realmente desee',
    'Con quien hacer cosas que le sirvan para olvidar sus problemas',
    'Que le ayude en sus tareas domésticas si está enfermo',
    'Alguien con quien compartir sus temores y problemas más íntimos',
    'Que le aconseje cómo resolver sus problemas personales',
    'Con quién divertirse',
    'Que comprenda sus problemas',
    'A quien amar y hacerle sentirse querido'
  ],
  extraItems:[
    {q:'Red cercana', type:'num', key:'amigos',
     hint:'Aproximadamente, ¿cuántos amigos íntimos o familiares cercanos tiene usted? Personas con las que se encuentra a gusto y puede hablar de todo lo que se le ocurre. Este dato describe el tamaño de la red y no suma puntos.',
     label:'Número de personas'}
  ],
  logic:a=>{
    const g=(ix)=>ix.reduce((n,i)=>n+(a[i]||0),0);
    const emo=g([1,2,6,7,11,14,15,17]), mat=g([0,3,10,13]), oci=g([5,9,12,16]), afe=g([4,8,18]);
    const tot=emo+mat+oci+afe;
    const amigos=STATE_EXTRA('amigos');
    const det='Índice global de apoyo social: '+tot+' (rango 19 a 95; valor medio de referencia 57).'
      +'\nApoyo emocional e informacional: '+emo+' de 40 (medio 24).'
      +'\nAyuda material o instrumental: '+mat+' de 20 (medio 12).'
      +'\nRelaciones sociales de ocio y distracción: '+oci+' de 20 (medio 12).'
      +'\nApoyo afectivo: '+afe+' de 15 (medio 9).'
      + (amigos!=='' && amigos!==undefined ? '\nTamaño de la red cercana: '+amigos+' persona(s).' : '');
    if(tot<38) return {t:'Apoyo social bajo',tone:'alert',d:det+'\nMuy por debajo del valor medio. Considere valoración por trabajo social y estrategias de activación de red.'};
    if(tot<57) return {t:'Apoyo social por debajo del promedio',tone:'warn',d:det+'\nEn caso de factores de riesgo social modificables, considere intervención y psicoeducación. Identifique cuál componente está más comprometido para dirigir la ayuda.'};
    return {t:'Apoyo social adecuado',tone:'ok',d:det+'\nPor encima del valor medio de referencia. Verifique que el apoyo percibido se traduzca en cuidados efectivos y sostenibles en el tiempo.'};
  },
  note:'El manual reporta como valores del índice global un máximo de 94, un medio de 57 y un mínimo de 19; la suma aritmética de los 19 ítems alcanza 95. Evalúa el apoyo percibido, no el recibido: un puntaje adecuado no descarta sobrecarga del cuidador ni vulnerabilidad social, por lo que debe contrastarse con la entrevista semiestructurada.'
},

/* Morfina oral diaria -> metadona oral diaria, razones dependientes de la dosis */
function metadonaDesdeMorfina(emo){
  const r = emo>300 ? 12 : emo>=90 ? 8 : 4;
  return {dosis: emo/r, razon: r,
    banda: emo>300 ? 'morfina oral mayor de 300 mg al día: razón 12:1'
         : emo>=90 ? 'morfina oral de 90 a 300 mg al día: razón 8:1'
                   : 'morfina oral de 30 a 90 mg al día: razón 4:1'};
}

function opiDptText(){
  const t = state.tool || {}, o = opiGet(t.from);
  const a = num(t.dpt), b = num(t.tomas);
  if(!isFinite(a) || !isFinite(b) || a<=0 || b<=0)
    return 'Opcional: si conoce la dosis por toma, ingrésela junto con el número de tomas y el total de 24 horas se calcula solo.';
  const u = o.u==='mcg' ? ' mcg' : ' mg';
  return 'Dosis total en 24 horas: <strong>'+dfmt(a*b)+u+'</strong> ('+dfmt(a)+u+' × '+dfmt(b)+' tomas).';
}

function opiSyncDosis(){
  const t = state.tool, a = num(t.dpt), b = num(t.tomas);
  if(isFinite(a) && isFinite(b) && a>0 && b>0){
    t.dose = String(Number((a*b).toFixed(4)));
    const inp = document.querySelector('input[data-op="dose"]');
    if(inp) inp.value = t.dose;
  }
  const box = document.getElementById('opidpt');
  if(box) box.innerHTML = opiDptText();
}

function opiCalc(){
  const t = state.tool || {};
  const o = opiGet(t.from), d = opiGet(t.to);
  const dosisTotal = num(t.dose);
  if(!o || !d || !isFinite(dosisTotal) || dosisTotal<=0) return null;
  const emo = dosisTotal * o.f;
  let bruta, metaBanda = null;
  if(d.metadona){ const m = metadonaDesdeMorfina(emo); bruta = m.dosis; metaBanda = m.banda; }
  else bruta = emo / d.f;
  const motivo = OPI_MOTIVOS.find(m=>m.id===(t.motivo||'estand')) || OPI_MOTIVOS[2];
  const final = bruta * (1 - motivo.r/100);
  const rescate = final * 0.10;
  let parche = null;
  if(d.parche){
    parche = d.pres.reduce((a,b)=> Math.abs(b-final)<Math.abs(a-final) ? b : a);
  }
  return {o,d,dosis:dosisTotal,emo,bruta,motivo,final,rescate,metaBanda,parche};
}

  set(k, v){ try{ localStorage.setItem('eg_'+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

let FAVS    = store.get('favs', []);

/* Valoración geriátrica integral en curso: vive solo en memoria, se
   pierde al cerrar o recargar. Nunca se escribe en el dispositivo. */
let VGI = {};

function esFav(id){ return FAVS.indexOf(id)>=0; }
function toggleFav(id){
  const i = FAVS.indexOf(id);
  if(i>=0) FAVS.splice(i,1); else FAVS.push(id);
  store.set('favs', FAVS);
}
function marcarReciente(id){
  RECIENT = [id].concat(RECIENT.filter(x=>x!==id)).slice(0,8);
  store.set('recientes', RECIENT);
}
/* Acepta coma o punto como separador decimal y descarta separadores de miles */
function num(v){
  if(v===undefined || v===null) return NaN;
  const s = String(v).trim().replace(/\s/g,'').replace(',', '.');
  return parseFloat(s);
}
/* Redondeo con precisión adaptada a la magnitud de la dosis */
function dfmt(n){
  if(!isFinite(n)) return '—';
  const abs = Math.abs(n);
  const dec = abs>=100 ? 0 : abs>=10 ? 1 : abs>=1 ? 2 : 3;
  return String(Number(n.toFixed(dec))).replace('.', ',');
}
function setEjeColor(eje){ document.documentElement.style.setProperty('--eje', 'var(--'+eje+')'); }
/* --ink existe como color base, de modo que la vista VGI queda neutra */

  });
}
function multiScore(it,sel){
  if(it.score==='threshold') return sel.length>=(it.min||5) ? 1 : 0;
  return sel.length;
}
function answered(){
  const s = SCALES[state.id]; if(!s) return 0;
  return s.items.reduce((n,it,i)=> n + (state.ans[i]!==undefined ? 1 : 0), 0);
}
function total(){
  const s = SCALES[state.id]; if(!s) return 0;
  return Math.round(s.items.reduce((sum,it,i)=> sum + (state.ans[i]||0), 0)*10)/10;
}
function complete(){
  const s = SCALES[state.id];
  return s ? answered()===s.items.length : false;
}

/* --------- EVIDENCIA: puntos de corte derivados de la propia lógica ---------
   En lugar de escribir los umbrales aparte, se recorre el rango completo
   de puntajes y se detectan los cambios de veredicto. Así lo que se
   muestra es siempre lo que la aplicación calcula, sin riesgo de que la
   documentación y el código se separen con el tiempo. */
function cortes(s){
  if(!s.max || !s.interpret) return null;
  const paso = Number.isInteger(s.max) ? 1 : 0.5;
  const bandas = [];
  for(let i=0; ; i++){
    const v = Math.round(i*paso*100)/100;
    if(v > s.max + 1e-9) break;
    const t = s.interpret(v).t;
    const ult = bandas[bandas.length-1];
    if(ult && ult.t===t) ult.hasta = v;
    else bandas.push({t, desde:v, hasta:v});
  }
  return bandas.map(b=>Object.assign(b, {
    paso,
    tone: s.interpret(b.desde).tone,
    rango: b.desde===b.hasta ? fmt(b.desde) : fmt(b.desde)+' a '+fmt(b.hasta)
  }));
}

/* Franja de bandas: sitúa el puntaje obtenido dentro del rango completo de
   la escala y muestra dónde caen los puntos de corte. Se construye con los
   mismos valores que calcula la aplicación. */
function franjaHTML(s, score){
  const c = cortes(s);
  if(!c || c.length<2) return '';
  const paso  = c[0].paso;
  const largo = s.max + paso;
  const col   = t => ({ok:'var(--ok)',warn:'var(--warn)',alert:'var(--alert)'}[t] || 'var(--muted)');
  const marca = (score!==null && score!==undefined && isFinite(score));
  const pos   = marca ? Math.max(0, Math.min(100, ((score + paso/2) / largo) * 100)) : 0;
  return '<div class="franja'+(marca?'':' sinmarca')+'">'
    + (marca?'<div class="fmark" style="left:'+pos.toFixed(2)+'%"><span>'+fmt(score)+'</span></div>':'')
    + '<div class="fstrip">'
    + c.map(b=>'<i style="flex:'+((b.hasta-b.desde+paso)/largo)+';background:'+col(b.tone)+'"></i>').join('')
    + '</div>'
    + '<div class="fleg">'
    + c.map(b=>'<span style="flex:'+((b.hasta-b.desde+paso)/largo)+'"><b>'+esc(b.rango)+'</b>'+esc(b.t)+'</span>').join('')
    + '</div></div>';
}

function tipoInstrumento(s){
  if(s.tool) return 'Calculadora de conversión';
  if(!s.max) return 'Algoritmo diagnóstico o de estadificación';
  return 'Escala de puntaje sumativo';
}

function fichaEvidencia(s){
  const c = cortes(s);
  return '<div class="ficha">'
    + '<div class="fh">Evidencia y referencia</div>'
    + '<div class="fr"><span>Instrumento</span><span>'+esc(s.full)+'</span></div>'

    + (s.max?'<div class="fr"><span>Rango</span><span>0 a '+fmt(s.max)+' puntos</span></div>':'')
    + (c ? '<div class="fh" style="margin-top:14px">Puntos de corte aplicados</div>'

       : '<div class="fh" style="margin-top:14px">Interpretación</div>'

function bmiText(){
  const p = num(state.extra.peso), t = num(state.extra.talla);
  if(!p || !t) return 'Ingrese peso y talla para calcular el IMC.';
  const imc = p / Math.pow(t/100,2);
  const sug = imc<19?'IMC menor de 19 → 0 puntos':imc<21?'IMC 19 a menos de 21 → 1 punto':imc<23?'IMC 21 a menos de 23 → 2 puntos':'IMC 23 o mayor → 3 puntos';
  return 'IMC calculado: <strong>'+imc.toFixed(1)+' kg/m²</strong> · '+sug;
}
function weightText(){
  const a = num(state.extra.wPrev), b = num(state.extra.wNow);
  if(!a || !b) return 'Opcional: ingrese ambos pesos para calcular el porcentaje de cambio.';
  const pct = ((a-b)/a)*100;
  return 'Cambio de peso: <strong>'+(pct>0?'-':'+')+Math.abs(pct).toFixed(1)+'%</strong> · '
    + (pct>=5?'Pérdida del 5 % o más':'Pérdida del 4 % o menos');

function renderOpiRes(){
  const box = document.getElementById('opires');
  if(!box) return;
  const r = opiCalc();
  if(!r){
    box.innerHTML = '<div class="derived" style="margin:0 0 14px">Seleccione el opioide de origen, ingrese la dosis de 24 horas y elija el opioide de destino para obtener el cálculo.</div>';
    return;
  }
  const alta = r.emo>=90;
  const alertas = [r.o.id,r.d.id].filter((v,i,a)=>a.indexOf(v)===i)
    .map(id=>OPI_ALERTA[id]?{id,txt:OPI_ALERTA[id]}:null).filter(Boolean);
  const uni = u => u==='mcg/h' ? ' mcg/h' : u==='mcg' ? ' mcg' : ' mg';
  const techo = r.d.techo && r.final>r.d.techo;
  const mismo = r.o.id===r.d.id;

  box.innerHTML =
    '<div class="result" style="margin-top:6px"><div class="band"></div><div class="body">'
    + '<span class="eyebrow" style="font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--eje)">Dosis de '+esc(opiLabel(r.d))+'</span>'
    + '<div class="score" style="margin-top:8px"><span class="n'+(dfmt(r.final).length>4?' sm':'')+'">'+dfmt(r.final)+'</span>'
    + '<span class="d">'+(r.d.parche?'mcg/h':uni(r.d.u).trim()+' al día')+'</span></div>'
    + (mismo?'<div class="verdict v-warn">Ajuste de dosis, no rotación</div>':'')
    + '<p class="detail">'+esc(
        (mismo
          ? 'El opioide y la vía de origen coinciden con los de destino, de modo que el cálculo no es una rotación sino un ajuste de dosis. '
          : dfmt(r.dosis)+uni(r.o.u)+(r.o.parche?'':' al día')+' de '+opiLabel(r.o)+' equivalen a '
             + (r.d.parche ? 'una liberación de '+dfmt(r.final)+' mcg/h de '+opiLabel(r.d)
                           : dfmt(r.final)+uni(r.d.u)+' al día de '+opiLabel(r.d))
             + ', una vez aplicada la reducción por tolerancia cruzada incompleta. ')
        + r.motivo.d)+'</p>'

    + '<div class="sub" style="border-top:1px solid var(--line)">'
    + '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:8px">Cómo se llegó a esa dosis</div>'
    + '<div class="breakdown" style="margin-top:0">'
    + '<div><span>Dosis de origen en 24 horas</span><span>'+dfmt(r.dosis)+uni(r.o.u)+'</span></div>'
    + '<div><span>Equivalente de morfina oral</span><span>'+dfmt(r.emo)+' mg</span></div>'
    + '<div><span>Dosis equianalgésica bruta</span><span>'+dfmt(r.bruta)+uni(r.d.u)+'</span></div>'
    + '<div><span>'+esc(r.motivo.l)+'</span><span>'+(r.motivo.r?'−'+r.motivo.r+' %':'sin reducción')+'</span></div>'
    + '<div style="border-bottom:none;padding-top:7px;font-size:14px;color:var(--ink);font-weight:600"><span>'
    + (r.d.parche?'Velocidad de liberación':'Dosis total en 24 horas')+'</span><span>'+dfmt(r.final)+uni(r.d.u)+'</span></div>'
    + '</div></div>'

    + '<p class="detail"><strong>Equivalente de morfina oral:</strong> '+dfmt(r.emo)+' mg al día. '
    + esc(alta
        ? 'El taller recomienda restringir el inicio de opioides por debajo de 90 mg de equivalentes de morfina; por encima de ese umbral revise indicación, adyuvantes y medidas no farmacológicas antes de escalar.'
        : 'Por debajo del umbral de 90 mg que el taller señala para revisar la indicación.')+'</p>'

    + (r.metaBanda?'<p class="detail">Se aplicó la razón dependiente de la dosis del taller: '+esc(r.metaBanda)+'.</p>':'')

    + (r.parche?'<p class="detail">Presentación disponible más cercana: parche de '+dfmt(r.parche)+' mcg/h. Los parches no se fraccionan: elija entre la presentación inmediatamente inferior y la superior según el control del dolor y la fragilidad del paciente, y combine presentaciones solo si es necesario.</p>':'')

    + (!r.d.parche && r.d.frac>1 ? '<p class="detail">Posología sugerida: '+esc(r.d.pos)+' Repartida en '+r.d.frac+' tomas queda en '+dfmt(r.final/r.d.frac)+uni(r.d.u)+' por dosis.</p>'
      : '<p class="detail">Posología sugerida: '+esc(r.d.pos)+'</p>')

    + '</div></div>';

/* ------------------ VALORACIÓN GERIÁTRICA INTEGRAL ------------------ */
function vgiAdd(){
  const s = SCALES[state.id];
  const score = total();
  const r = s.logic ? s.logic(s.items.map((_,i)=>state.ans[i])) : s.interpret(score);
  VGI[state.id] = {
    id: state.id, eje: s.eje, dom: s.dom, nombre: s.name,
    valor: s.max ? fmt(score)+' / '+fmt(s.max) : (r.display || (r.tone==='alert'?'Positivo':'Negativo')),
    t: r.t, tone: r.tone, ts: Date.now()
  };
}

function vgiTexto(){
  const f = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});
  let out = 'VALORACIÓN GERIÁTRICA INTEGRAL\nFecha: '+f+'\n';
  EJES.forEach(e=>{
    const items = Object.values(VGI).filter(v=>v.eje===e.id);
    if(!items.length) return;
    out += '\n'+(e.largo ? e.largo.toUpperCase() : 'EJE '+e.label.toUpperCase())+'\n';
    items.forEach(v=>{ out += '  '+v.dom+' — '+v.nombre+': '+v.valor+'. '+v.t+'.\n'; });
  });
  out += '\nEscalas de tamización: los resultados no constituyen por sí solos un diagnóstico y deben correlacionarse con la historia clínica.';
  return out;
}

function renderVGI(){
  const n = Object.keys(VGI).length;
  let html = '<p class="lede">Reúna los resultados de varias escalas para construir el panorama de los cuatro ejes y obtener un resumen listo para la historia clínica.</p>';

  if(!n){
    html += '<div class="vacio">Todavía no ha añadido ninguna escala.<br><br>Aplique una escala y, en la pantalla de resultado, toque <strong>Añadir a la valoración</strong>.</div>'
      + '<div class="ref" style="margin-top:18px"><b>Privacidad</b>Esta valoración vive únicamente en la memoria del dispositivo mientras la aplicación está abierta: se pierde al cerrarla o recargarla, y nunca se guarda ni se transmite. Aun así, no ingrese nombres, documentos ni ningún dato que identifique al paciente.</div>';
    $('#view').innerHTML = html;
    return;
  }

  EJES.forEach(e=>{
    const items = Object.values(VGI).filter(v=>v.eje===e.id).sort((a,b)=>a.ts-b.ts);
    if(!items.length) return;
    html += '<div class="grp">'+esc(e.largo || ('Eje '+e.label))+'</div>'
      + items.map(v=>{
          const col = {ok:'var(--ok)',warn:'var(--warn)',alert:'var(--alert)'}[v.tone] || 'var(--muted)';
          return '<div class="vgi-item" style="--eje:var(--'+v.eje+')">'
            + '<button class="vx" data-quitar="'+v.id+'" aria-label="Quitar">&times;</button>'
            + '<div class="vt">'+esc(v.nombre)+'</div>'
            + '<div class="vv">'+esc(v.dom)+' · '+esc(v.valor)+'</div>'
            + '<div class="vi" style="color:'+col+'">'+esc(v.t)+'</div></div>';
        }).join('');
  });

  const faltan = EJES.filter(e=>!e.largo && !Object.values(VGI).some(v=>v.eje===e.id));
  if(faltan.length)
    html += '<div class="derived" style="margin-top:16px">Ejes sin evaluar: <strong>'
      + faltan.map(e=>e.label).join(', ')+'</strong>. La valoración geriátrica integral solo lo es cuando cubre los cuatro.</div>';

  html += '<div class="actions" style="margin-top:18px">'
    + '<button class="btn" data-act="vgiclear">Vaciar</button>'
    + '<button class="btn btn-primary" data-act="vgicopy">Copiar resumen</button></div>'
    + '<p class="toast" id="toast"></p>'
    + '<textarea class="copybox" id="copybox" style="display:none" readonly>'+esc(vgiTexto())+'</textarea>'
    + '<div class="ref"><b>Privacidad</b>Esta valoración vive únicamente en la memoria del dispositivo mientras la aplicación está abierta: se pierde al cerrarla o recargarla, y nunca se guarda ni se transmite. Aun así, no ingrese nombres, documentos ni ningún dato que identifique al paciente.</div>';

  $('#view').innerHTML = html;
}

/* ------------------- PENDIENTES Y RESUMEN ------------------- */
function clearPend(node){
  if(!state.flagPend || !node) return;
  const box = node.closest ? node.closest('.item') : null;
  if(!box) return;
  box.classList.remove('pend');
  const pin = box.querySelector('.pin');
  if(pin) pin.remove();
}

function flagPending(){
  const s = SCALES[state.id];
  state.flagPend = true;
  render();
  const first = s.items.findIndex((_,i)=>state.ans[i]===undefined);
  const node = document.getElementById('it'+first);
  if(node) node.scrollIntoView({behavior:'smooth', block:'center'});
}

function summaryText(){
  const s = SCALES[state.id];
  const score = total();
  const r = s.logic ? s.logic(s.items.map((_,i)=>state.ans[i])) : s.interpret(score);
  const val = s.max ? fmt(score)+' / '+fmt(s.max)+' puntos'
                    : (r.display || (r.tone==='alert'?'Positivo':'Negativo'));
  const f = new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});
  return s.name+' — '+s.full+'\n'
    + 'Resultado: '+val+'\n'
    + 'Interpretación: '+r.t+'\n'
    + 'Aplicada el '+f+'.\n'
    + 'Escala de tamización: el resultado no constituye por sí solo un diagnóstico.';
}

function copiar(txt, btn){
  const toast = document.getElementById('toast');
  const box   = document.getElementById('copybox');
  const aviso = (m, err)=>{
    if(toast){ toast.className = 'toast'+(err?' err':''); toast.textContent = m; }
    else if(btn){ const o = btn.textContent; btn.textContent = err?'No se pudo copiar':'Copiado';
                  setTimeout(()=>{ btn.textContent = o; }, 1800); }
  };
  const ok   = ()=> aviso('Copiado al portapapeles', false);
  const fail = ()=>{
    aviso('No se pudo copiar. Seleccione el texto y cópielo manualmente.', true);
    if(box){ box.value = txt; box.style.display='block'; box.focus(); box.select(); }
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok).catch(fail);
    } else if(box){
      box.value = txt; box.style.display='block'; box.focus(); box.select();
      document.execCommand('copy') ? ok() : fail();
    } else fail();
  }catch(e){ fail(); }
}

function copySummary(btn){ copiar(summaryText(), btn); }

/* ------------------------ TAMAÑO DE TEXTO ------------------------ */
function setTamano(n){
  store.set('tsize', n);
  document.body.className = n===1 ? 'tg1' : n===2 ? 'tg2' : '';
  const g = document.querySelector('.sizer');
  if(g) g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.t===n));
}

/* ---------------------------- EVENTOS ---------------------------- */
function openScale(id){
  const s = SCALES[id];
  marcarReciente(id);
  if(s.tool){
    state = {view:'tool', eje:s.eje, id:id, ans:{}, sel:{}, multi:{}, extra:{}, q:state.q, dom:state.dom, evid:false, showResult:false,
             tool:{from:'mor_vo', dose:'', dpt:'', tomas:'', to:'oxi_vo', motivo:'estand'}};
    render(); return;
  }
  state = {view:'scale', eje:s.eje, id:id, ans:{}, sel:{}, multi:{}, extra:{}, q:state.q, dom:state.dom, evid:false, showResult:false};
  initScale(); render();
}

document.addEventListener('click', e=>{
  const tab = e.target.closest('[data-tab]');
  if(tab){
    if(tab.dataset.tab==='vgi'){ state = {...state, view:'vgi', id:null, q:'', dom:null, showResult:false}; render(); return; }
    state = {view:'list', eje:tab.dataset.tab, id:null, ans:{}, sel:{}, multi:{}, extra:{}, q:'', dom:null, showResult:false};
    render(); return;
  }

  const open = e.target.closest('[data-open]');
  if(open){ openScale(open.dataset.open); return; }

  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a==='about'){ state.view='about'; render(); }
    if(a==='back'){ state.view='list'; state.showResult=false; render(); }
    if(a==='result'){
      if(!complete()){ flagPending(); return; }
      state.flagPend=false; state.showResult=true; render();
    }
    if(a==='copy'){ copySummary(act); }
    if(a==='review'){ state.showResult=false; render(); }
    if(a==='clearq'){ state.q=''; render(); }
    if(a==='evid'){ state.evid = !state.evid; render(); }
    if(a==='fav'){ toggleFav(state.id); act.setAttribute('aria-pressed', esFav(state.id)); }
    if(a==='copyref'){ copiar(SCALES[state.id].ref, act); }
    if(a==='addvgi'){ vgiAdd(); render(); }
    if(a==='vgicopy'){ copiar(vgiTexto(), act); }
    if(a==='vgiclear'){ VGI = {}; render(); }
    if(a==='tsize'){ setTamano(+act.dataset.t); }
    if(a==='reset'){ state = {...state, ans:{}, sel:{}, multi:{}, extra:{}, flagPend:false, showResult:false}; initScale(); render(); }
    return;
  }

  const mot = e.target.closest('[data-motivo]');
  if(mot){
    state.tool.motivo = mot.dataset.motivo;
    mot.parentElement.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', b===mot));
    renderOpiRes();
    return;
  }

  const dom = e.target.closest('[data-dom]');
  if(dom){ state.dom = (state.dom===dom.dataset.dom) ? null : dom.dataset.dom; render(); return; }

  const quitar = e.target.closest('[data-quitar]');
  if(quitar){ delete VGI[quitar.dataset.quitar]; render(); return; }

  const opt = e.target.closest('[data-ans]');
  if(opt){
    const i = +opt.dataset.ans;
    state.ans[i] = +opt.dataset.v;
    state.sel[i] = +opt.dataset.oi;
    opt.parentElement.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', b===opt));
    clearPend(opt);
    renderScorebar(); renderSpine();
    return;
  }

  const chip = e.target.closest('[data-chip]');
  if(chip){
    const i = +chip.dataset.mi, ci = +chip.dataset.chip;
    const it = SCALES[state.id].items[i];
    const sel = state.multi[i] || (state.multi[i]=[]);
    const at = sel.indexOf(ci);
    if(at>=0) sel.splice(at,1); else sel.push(ci);
    chip.setAttribute('aria-pressed', at<0);
    state.ans[i] = multiScore(it, sel);
    const c = document.getElementById('mc'+i), sc = document.getElementById('ms'+i);
    if(c) c.textContent = sel.length;
    if(sc) sc.textContent = state.ans[i];
    renderScorebar(); renderSpine();
  }
});

document.addEventListener('change', e=>{
  const sel = e.target.closest('select[data-op]');
  if(!sel) return;
  state.tool[sel.dataset.op] = sel.value;
  if(sel.dataset.op==='from'){ state.tool.dpt=''; state.tool.tomas=''; renderTool(); }
  else renderOpiRes();
});

document.addEventListener('input', e=>{
  const op = e.target.closest('input[data-op]');
  if(op){
    state.tool[op.dataset.op] = op.value;
    if(op.dataset.op==='dpt' || op.dataset.op==='tomas') opiSyncDosis();
    else { state.tool.dpt=''; state.tool.tomas=''; const b=document.getElementById('opidpt'); if(b) b.innerHTML=opiDptText(); }
    renderOpiRes();
    return;
  }

  const q = e.target.closest('#q');
  if(q){
    state.q = q.value;
    const box = document.getElementById('list');
    if(box) box.innerHTML = listInner();
    const wrap = q.parentElement;
    let clr = wrap.querySelector('.clr');
    if(state.q && !clr){
      clr = document.createElement('button');
      clr.className='clr'; clr.dataset.act='clearq'; clr.setAttribute('aria-label','Limpiar');
      clr.innerHTML='&times;'; wrap.appendChild(clr);
    } else if(!state.q && clr){ clr.remove(); }
    return;
  }
  const n = e.target.closest('[data-num]');
  if(!n) return;
  state.extra[n.dataset.num] = n.value;
  const b = document.getElementById('bmiOut'); if(b) b.innerHTML = bmiText();
  const w = document.getElementById('wOut');  if(w) w.innerHTML = weightText();
});

/* ---------- Service Worker (PWA offline) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', ()=>{
          if(nuevo.state==='installed' && navigator.serviceWorker.controller){
            const t = document.getElementById('toast');
            if(t){ t.className='toast'; t.textContent='Hay una versión nueva: cierre y vuelva a abrir la aplicación.'; }
          }
        });
      });
    }).catch(err => console.warn('SW no registrado', err));
  });
}

setTamano(store.get('tsize',0));
render();
</script>
