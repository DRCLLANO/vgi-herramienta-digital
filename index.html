<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escalas Geriatría">
<meta name="application-name" content="Escalas Geriatría">
<meta name="theme-color" content="#102238">
<meta name="msapplication-TileColor" content="#102238">
<meta name="description" content="Calculadora de escalas de la valoración geriátrica integral: eje clínico, funcional, mental y social.">
<title>Escalas de uso frecuente en Geriatría</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202E;
  --ink-2:#3D4C5C;
  --muted:#6B7885;
  --paper:#EEF1F4;
  --card:#FFFFFF;
  --line:#DCE2E8;
  --line-2:#B9C3CC;
  --field:#FBFCFD;
  --tint:#E7EBEF;
  --tint-2:#F3F6F8;
  --bar:#16202E;
  --bar-fg:#FFFFFF;
  --glass:rgba(255,255,255,.93);
  --glass-top:rgba(238,241,244,.92);
  --rail:#E2E7EC;
  --clinico:#9E4257;
  --funcional:#7A3E8E;
  --mental:#4C6FA5;
  --social:#97133F;
  --paliativo:#2C6E63;
  --ok:#2E6B4F;
  --warn:#A6641C;
  --alert:#9E2B2B;
  --eje:var(--clinico);
  --spine:14px;
  --sombra:0 8px 24px rgba(16,32,46,.22);
  --sobre-eje:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
input{font-family:inherit;}

/* ---------- Signature: color spine that fills with progress ---------- */
#spine{
  position:fixed;left:0;top:0;bottom:0;width:var(--spine);
  background:var(--rail);z-index:40;
}
#spine .fill{
  position:absolute;left:0;top:0;width:100%;height:0%;
  background:var(--eje);
  transition:height .35s cubic-bezier(.4,0,.2,1), background-color .3s ease;
}
#spine .fill::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in srgb, var(--paper) 65%, transparent);
}

/* ---------- Shell ---------- */
#app{
  padding-left:calc(var(--spine) + env(safe-area-inset-left));
  padding-right:env(safe-area-inset-right);
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  min-height:100vh;
}
header.top{
  position:sticky;top:0;z-index:20;
  background:var(--glass-top);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px 18px;
  display:flex;align-items:flex-end;gap:12px;
}
.top .eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--eje);display:block;margin-bottom:1px;
}
.top h1{
  font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:21px;
  margin:0;line-height:1.1;letter-spacing:-.01em;flex:1;
}
.top .glyph{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;flex:none;
  font-family:'Fraunces',serif;font-size:15px;color:var(--ink-2);
}
.back{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:15px;color:var(--eje);font-weight:500;padding:4px 6px 4px 0;margin-bottom:2px;
}
.back svg{width:9px;height:15px;}

main{padding:20px 18px 8px 18px;max-width:640px;margin:0 auto;}

/* ---------- Scale list ---------- */
.lede{color:var(--muted);font-size:14.5px;margin:0 0 16px;max-width:34em;}
.search{
  display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:0 13px;margin-bottom:18px;
}
.search svg{width:15px;height:15px;flex:none;color:var(--muted);}
.search input{
  flex:1;border:none;background:none;padding:12px 0;font-size:15px;color:var(--ink);outline:none;
}
.search input::placeholder{color:var(--muted);}
.search .clr{color:var(--muted);font-size:19px;line-height:1;padding:4px;}
.grp{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:20px 0 9px;
  display:flex;align-items:center;gap:9px;
}
.grp::after{content:"";flex:1;height:1px;background:var(--line);}
.grp:first-child{margin-top:2px;}
.card{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;
  position:relative;overflow:hidden;transition:transform .12s ease;
}
.card:active{transform:scale(.985);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--eje);}
.card .dom{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);
}
.card h2{font-family:'Fraunces',serif;font-weight:600;font-size:18.5px;margin:3px 0 3px;line-height:1.15;}
.card p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.4;}
.card .meta{margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
.card .ejetag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:7px;vertical-align:1px;
}
.empty{color:var(--muted);font-size:14px;padding:22px 2px;}

/* ---------- Scale detail ---------- */
.scale-head{margin-bottom:22px;}
.scale-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:2px 0 6px;line-height:1.1;letter-spacing:-.015em;}
.scale-head p{margin:0;font-size:14px;color:var(--ink-2);}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px 13px;margin-bottom:12px;
}
.item .num{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  color:var(--eje);text-transform:uppercase;
}
.item .q{font-weight:600;font-size:15.5px;margin:3px 0 4px;line-height:1.32;}
.item .hint{font-size:12.8px;color:var(--muted);margin:0 0 10px;line-height:1.4;}
.item.pend{border-color:var(--eje);box-shadow:0 0 0 3px color-mix(in srgb, var(--eje) 13%, transparent);}
.item .num .pin{
  margin-left:8px;padding:1px 7px;border-radius:999px;font-size:9.5px;letter-spacing:.08em;
  background:color-mix(in srgb, var(--eje) 12%, var(--card));color:var(--eje);
}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
.opt{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:14.5px;line-height:1.32;background:var(--field);transition:all .13s ease;
}
.opt .dot{
  width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:1px;
  display:grid;place-items:center;
}
.opt[aria-pressed="true"]{
  border-color:var(--eje);background:color-mix(in srgb, var(--eje) 7%, var(--card));
  font-weight:500;
}
.opt[aria-pressed="true"] .dot{border-color:var(--eje);background:var(--eje);}
.opt[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--sobre-eje);}
.opt .val{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);flex:none;padding-left:8px;
}
.opt[aria-pressed="true"] .val{color:var(--eje);}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;background:var(--field);
  text-align:left;line-height:1.3;
}
.chip[aria-pressed="true"]{border-color:var(--eje);background:color-mix(in srgb, var(--eje) 10%, var(--card));font-weight:500;color:var(--eje);}
.calc{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.field{flex:1;min-width:110px;}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.field input{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px;
  background:var(--field);color:var(--ink);
}
.field input:focus,.field select:focus{outline:2px solid var(--eje);outline-offset:1px;border-color:transparent;}
.field select{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px;
  background:var(--field);color:var(--ink);appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%236B7885' stroke-width='1.8' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;background-size:11px;padding-right:32px;
}
.result .detail strong{color:var(--ink);}
.derived{
  margin-top:11px;padding:10px 12px;border-radius:9px;background:var(--tint-2);border:1px dashed var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-2);line-height:1.5;
}
.derived strong{color:var(--eje);}

/* ---------- Result ---------- */
.result{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:0;overflow:hidden;margin-bottom:14px;
}
.result .band{height:6px;background:var(--eje);}
.result .body{padding:22px 20px 20px;}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.score .n{font-family:'Fraunces',serif;font-weight:700;font-size:62px;line-height:.9;letter-spacing:-.03em;color:var(--ink);}
.score .n.sm{font-size:34px;line-height:1.05;}
.score .d{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--muted);}
.verdict{
  display:inline-block;margin-top:16px;padding:7px 14px;border-radius:999px;
  font-weight:600;font-size:15px;
}
.v-ok{background:color-mix(in srgb, var(--ok) 12%, var(--card));color:var(--ok);}
.v-warn{background:color-mix(in srgb, var(--warn) 14%, var(--card));color:var(--warn);}
.v-alert{background:color-mix(in srgb, var(--alert) 12%, var(--card));color:var(--alert);}
.result .detail{margin:14px 0 0;font-size:14.5px;color:var(--ink-2);line-height:1.5;white-space:pre-line;}
.result .sub{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  font-size:13px;color:var(--muted);line-height:1.5;
}
.breakdown{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.breakdown div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--line);}
.extmark{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:7px;vertical-align:1px;
  background:var(--tint);color:var(--muted);
}
.actions{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.actions .btn{min-width:130px;}
.toast{
  text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;
  color:var(--ok);margin:0 0 16px;min-height:16px;
}
.toast.err{color:var(--alert);}
.copybox{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:16px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.5;color:var(--ink-2);
  background:var(--card);resize:vertical;min-height:120px;
}
.btn{
  flex:1;border-radius:11px;padding:13px;text-align:center;font-weight:600;font-size:15px;
  border:1px solid var(--line);background:var(--card);
}
.btn-primary{background:var(--eje);color:var(--sobre-eje);border-color:var(--eje);}
.ref{
  font-size:12px;color:var(--muted);line-height:1.5;background:var(--tint);
  border-radius:12px;padding:13px 15px;margin-bottom:18px;
}
.ref b{color:var(--ink-2);font-weight:600;display:block;margin-bottom:3px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;}

/* ---------- Sticky score bar ---------- */
.scorebar{
  position:fixed;left:var(--spine);right:0;bottom:calc(66px + env(safe-area-inset-bottom));
  z-index:25;padding:0 18px 10px;pointer-events:none;
}
.scorebar .inner{
  max-width:604px;margin:0 auto;pointer-events:auto;
  background:var(--bar);color:var(--bar-fg);border-radius:13px;
  padding:11px 14px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--sombra);
}
.scorebar .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;}
.scorebar .val{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1;}
.scorebar .val span{font-size:12px;font-family:'IBM Plex Mono',monospace;opacity:.6;}
.scorebar .go{
  margin-left:auto;background:var(--bar-fg);color:var(--bar);border-radius:9px;padding:9px 15px;font-weight:600;font-size:14px;
}
.scorebar .go[disabled]{opacity:.35;}

/* ---------- Tab bar ---------- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--glass);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  padding-left:calc(var(--spine) + 4px);
}
nav.tabs button{
  flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;letter-spacing:-.01em;color:var(--muted);padding:2px 1px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
nav.tabs button .mark{width:18px;}
nav.tabs button[aria-current="true"] .mark{width:22px;height:5px;}
nav.tabs button .mark{
  width:22px;height:4px;border-radius:2px;background:var(--line-2);transition:all .2s ease;
}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:600;}
nav.tabs button[aria-current="true"] .mark{width:26px;height:5px;}
nav.tabs button:nth-child(1)[aria-current="true"] .mark{background:var(--clinico);}
nav.tabs button:nth-child(2)[aria-current="true"] .mark{background:var(--funcional);}
nav.tabs button:nth-child(3)[aria-current="true"] .mark{background:var(--mental);}
nav.tabs button:nth-child(4)[aria-current="true"] .mark{background:var(--social);}
nav.tabs button:nth-child(5)[aria-current="true"] .mark{background:var(--paliativo);}

/* ---------- About ---------- */
.about h3{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:22px 0 7px;}
.about p{font-size:14px;color:var(--ink-2);line-height:1.55;margin:0 0 10px;}
.about .cite{font-size:12.5px;color:var(--muted);line-height:1.5;padding-left:14px;border-left:2px solid var(--line);margin-bottom:11px;}
.sig{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:24px;
}
.sig .cab{display:flex;align-items:center;gap:15px;margin-bottom:12px;}
.sig .retrato{
  width:82px;height:82px;border-radius:50%;flex:none;object-fit:cover;object-position:50% 42%;
  border:3px solid var(--card);box-shadow:0 0 0 1px var(--line), 0 4px 14px rgba(16,32,46,.16);
  background:var(--tint);
}
.sig .cab > div{min-width:0;}
.sig .cab .name{margin:0 0 2px;}
.sig .orcid{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.02em;
}
.sig .name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:4px 0 2px;}
.sig .role{font-size:13px;color:var(--muted);line-height:1.5;}
.disclaimer{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:18px;}

/* ---------- Criterios que operativizan un ítem ---------- */
.crits{margin:2px 0 12px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--tint-2);}
.crits > div{border-top:1px solid var(--line);}
.crits > div:first-child{border-top:none;}
.crits summary{
  cursor:pointer;list-style:none;padding:11px 13px;font-size:13.5px;font-weight:600;
  color:var(--ink-2);display:flex;align-items:center;gap:9px;line-height:1.3;
}
.crits summary::-webkit-details-marker{display:none;}
.crits summary::before{
  content:"";flex:none;width:7px;height:7px;border-right:1.6px solid var(--eje);
  border-bottom:1.6px solid var(--eje);transform:rotate(-45deg);margin-left:2px;
  transition:transform .18s ease;
}
.crits details[open] summary::before{transform:rotate(45deg);}
.crits .cd{padding:0 13px 13px 31px;font-size:13px;line-height:1.5;color:var(--ink-2);}
.crits .ch{
  padding:9px 13px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);background:var(--tint);
}

/* ---------- Franja de bandas del resultado ---------- */
.franja{margin:22px 0 4px;}
.fstrip{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);}
.fstrip i{display:block;min-width:2px;}
.franja.sinmarca{margin-top:6px;}
.fmark{position:relative;height:26px;}
.fmark span{
  position:absolute;left:0;transform:translateX(-50%);bottom:6px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;
  background:var(--bar);color:var(--bar-fg);border-radius:6px;padding:3px 8px;white-space:nowrap;
}
.fmark span::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-4px;
  border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--bar);
}
.fleg{display:flex;margin-top:7px;gap:4px;}
.fleg span{
  font-size:10.5px;line-height:1.3;color:var(--muted);min-width:0;
  padding-right:4px;border-left:1px solid var(--line);padding-left:6px;
}
.fleg span:first-child{border-left:none;padding-left:0;}
.fleg b{
  display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;
  color:var(--ink-2);font-weight:500;
}

/* ---------- Encabezado de eje con más presencia ---------- */
.hero{margin:2px 0 20px;}
.hero h2{
  font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1.02;
  letter-spacing:-.025em;margin:0 0 8px;color:var(--ink);
}
.hero h2 em{font-style:normal;color:var(--eje);}
.hero p{color:var(--muted);font-size:14.5px;margin:0;max-width:34em;line-height:1.5;}
.hero .cnt{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--eje);
}
.hero .cnt::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--eje);}
.grp .n{color:var(--line-2);margin-left:2px;}

/* ---------- Acceso rápido: favoritas y recientes ---------- */
.quick{margin-bottom:18px;}
.quick .qh{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:9px;
}
.qrow{display:flex;flex-wrap:wrap;gap:7px;}
.qchip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:13.5px;background:var(--card);line-height:1.2;
}
.qchip .qd{width:7px;height:7px;border-radius:50%;flex:none;}
.domchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.domchip{
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;
  background:var(--card);color:var(--ink-2);
}
.domchip[aria-pressed="true"]{border-color:var(--eje);background:color-mix(in srgb, var(--eje) 10%, var(--card));color:var(--eje);font-weight:500;}

/* ---------- Estrella de favorito ---------- */
.star{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;flex:none;
}
.star svg{width:16px;height:16px;}
.star[aria-pressed="true"]{border-color:var(--eje);background:color-mix(in srgb, var(--eje) 10%, var(--card));}
.star[aria-pressed="true"] svg{fill:var(--eje);stroke:var(--eje);}

/* ---------- Ficha de evidencia ---------- */
.ficha{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 17px;margin-bottom:18px;
}
.ficha .fh{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--eje);margin-bottom:9px;
}
.ficha .fr{
  display:flex;gap:14px;padding:6px 0;border-bottom:1px dotted var(--line);
  font-size:13px;line-height:1.45;
}
.ficha .fr span:first-child{
  flex:0 0 34%;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;padding-top:2px;
}
.ficha .fr span:last-child{flex:1;color:var(--ink-2);}
.ficha .fcita{font-size:12.5px;color:var(--muted);line-height:1.55;}
.ficha .btn{width:100%;}

/* ---------- Valoración geriátrica integral ---------- */
.vgi-item{
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;margin-bottom:9px;position:relative;overflow:hidden;
}
.vgi-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
.vgi-item .vt{font-weight:600;font-size:15px;line-height:1.25;}
.vgi-item .vv{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-top:3px;
}
.vgi-item .vi{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.4;}
.vgi-item .vx{
  position:absolute;right:9px;top:9px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);font-size:17px;line-height:1;
}
.vacio{
  background:var(--card);border:1px dashed var(--line);border-radius:14px;
  padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55;
}
nav.tabs button:nth-child(6)[aria-current="true"] .mark{background:var(--ink);}

/* ---------- Tamaño de texto ---------- */
body.tg1{font-size:17px;}
body.tg1 .opt,body.tg1 .item .q,body.tg1 .result .detail,body.tg1 .card p,body.tg1 .about p{font-size:16px;}
body.tg1 .item .hint,body.tg1 .ref,body.tg1 .result .sub{font-size:14px;}
body.tg2{font-size:19px;}
body.tg2 .opt,body.tg2 .item .q,body.tg2 .result .detail,body.tg2 .card p,body.tg2 .about p{font-size:17.5px;}
body.tg2 .item .hint,body.tg2 .ref,body.tg2 .result .sub{font-size:15.5px;}
body.tg2 .card h2{font-size:20px;}
.sizer{display:flex;gap:8px;margin:10px 0 4px;}
.sizer button{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--card);
  font-weight:600;
}
.sizer button[aria-pressed="true"]{border-color:var(--eje);background:color-mix(in srgb, var(--eje) 9%, var(--card));color:var(--eje);}
.sizer button:nth-child(1){font-size:14px;}
.sizer button:nth-child(2){font-size:16px;}
.sizer button:nth-child(3){font-size:18px;}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}

  items:[

    {q:'Movilidad',

painad:{
  eje:'clinico', dom:'Dolor',
  name:'PAINAD',
  full:'Pain Assessment in Advanced Dementia',
  blurb:'Cinco indicadores observacionales para evaluar dolor en personas con demencia avanzada que no pueden autorreportarlo.',
  max:10,
  external:true,
  ref:'Warden V, Hurley AC, Volicer L. Development and psychometric evaluation of the Pain Assessment in Advanced Dementia (PAINAD) scale. J Am Med Dir Assoc. 2003;4(1):9-15. Versión española validada: García-Soler Á, Sánchez-Iglesias I, Buiza C, Alaba J, Navarro AB, Arriola E, et al. Adaptación y validación de la versión española de la escala de evaluación de dolor en personas con demencia avanzada: PAINAD-Sp. Rev Esp Geriatr Gerontol. 2014;49(1):10-4. Escala complementaria: no forma parte del manual de referencia.',
  items:[
    {q:'Respiración independiente de la vocalización',
     hint:'Observe el patrón respiratorio en reposo, sin considerar los sonidos que acompañan al habla o al quejido.',
     o:[{l:'Normal',v:0},
        {l:'Respiración ocasionalmente dificultosa o periodos cortos de hiperventilación',v:1},
        {l:'Respiración dificultosa y ruidosa, periodos largos de hiperventilación o respiración de Cheyne-Stokes',v:2}]},
    {q:'Vocalización negativa',
     o:[{l:'Ninguna',v:0},
        {l:'Gemidos o quejidos ocasionales; habla en volumen bajo o con desaprobación',v:1},
        {l:'Llamadas agitadas repetidas, gemidos o quejidos en volumen alto, llanto',v:2}]},
    {q:'Expresión facial',
     o:[{l:'Sonriente o inexpresiva',v:0},
        {l:'Triste, atemorizada o con el ceño fruncido',v:1},
        {l:'Muecas de disgusto o de dolor',v:2}]},
    {q:'Lenguaje corporal',
     o:[{l:'Relajado',v:0},
        {l:'Tenso, camina de forma angustiada, no para quieto',v:1},
        {l:'Rígido, puños cerrados, rodillas flexionadas; se aparta o empuja al examinador; agresividad',v:2}]},
    {q:'Consolabilidad',
     o:[{l:'Sin necesidad de consolar',v:0},
        {l:'Se le distrae o tranquiliza con la voz o el tacto',v:1},
        {l:'Imposible consolarlo, distraerlo o tranquilizarlo',v:2}]}
  ],
  interpret:s=> s===0 ? {t:'Sin indicadores de dolor',tone:'ok',d:'No se observan indicadores conductuales en esta evaluación. Repita la observación durante la movilización, el baño o los cambios de posición, que es cuando el dolor suele hacerse evidente.'}
             : s<=3  ? {t:'Dolor leve',tone:'warn',d:'Un puntaje de 1 o más sugiere presencia de dolor. Identifique la causa (lesiones por presión, retención urinaria, estreñimiento, artrosis, posición forzada), inicie analgesia escalonada y reevalúe con la misma escala tras la intervención.'}
             : s<=6  ? {t:'Dolor moderado',tone:'alert',d:'Requiere intervención analgésica y búsqueda activa de la causa. Reevalúe con la misma escala después de administrar el analgésico para verificar la respuesta.'}
                     : {t:'Dolor intenso',tone:'alert',d:'Equivale a un dolor severo. Inicie manejo analgésico multimodal sin demora, descarte causas agudas (fractura, abdomen agudo, isquemia, retención urinaria) y reevalúe de forma estrecha. Considere valoración por clínica del dolor si no hay respuesta.'},
  note:'El puntaje total va de 0 a 10 y es equiparable a una escala visual análoga de 0 a 10. Observe al paciente durante 3 a 5 minutos, preferiblemente en actividad o durante el cuidado, no solo en reposo. Un delirium, la agitación o la ansiedad pueden elevar el puntaje: correlacione siempre con el contexto clínico y con la respuesta a la analgesia.'
},

necpal:{
  eje:'paliativo', dom:'Necesidades paliativas',
  name:'NECPAL CCOMS-ICO',
  full:'Instrumento de identificación de necesidades paliativas, versión 3.1',
  blurb:'Pregunta sorpresa más trece parámetros operativizados con umbrales explícitos. Uso recomendado en todos los niveles asistenciales.',
  max:null,
  external:true,
  ref:'Gómez-Batiste X, Martínez-Muñoz M, Blay C, Amblàs J, Vila L, Costa X. Identificación de personas con enfermedades crónicas avanzadas y necesidad de atención paliativa en servicios sanitarios y sociales: elaboración del instrumento NECPAL CCOMS-ICO. Med Clín. 2013;140(6):241-5. Umbrales operativos según el Instrumento NECPAL CCOMS-ICO© versión 3.1, 2017. Los criterios específicos por patología del bloque 4 se presentan aquí operativizados con los criterios de enfermedad avanzada de la National Hospice and Palliative Care Organization. Medical guidelines for determining prognosis in selected non-cancer diseases. 2.ª ed. Arlington; 1996.',
  items:[
    {q:'1. Pregunta sorpresa',
     hint:'¿Le sorprendería que este paciente muriese a lo largo del próximo año? Pregunta intuitiva que integra comorbilidad, aspectos sociales y otros factores. Responder "no me sorprendería" es lo que define la pregunta sorpresa como positiva.',
     o:[{l:'No me sorprendería',v:1},{l:'Sí me sorprendería',v:0}]},

    {q:'2. Demanda',
     hint:'¿Ha habido alguna expresión implícita o explícita de limitación del esfuerzo terapéutico o demanda de atención paliativa por parte del paciente, la familia o miembros del equipo?',
     o:si_no},
    {q:'3. Necesidad',
     hint:'Necesidad de atención paliativa identificada por los profesionales miembros del equipo.',
     o:si_no},

    {q:'4. Declive nutricional',
     hint:'Pérdida de peso mayor del 10 % en los últimos 6 meses, no relacionada con un proceso intercurrente reciente o reversible.',
     o:si_no},
    {q:'5. Declive funcional',
     hint:'En los últimos 6 meses, no relacionado con un proceso intercurrente reciente o reversible: deterioro del Karnofsky o del Barthel mayor del 30 %, o pérdida de más de 2 actividades básicas de la vida diaria.',
     o:si_no},
    {q:'6. Declive cognitivo',
     hint:'En los últimos 6 meses, no relacionado con un proceso intercurrente reciente o reversible: pérdida de 5 o más puntos en el minimental, o de 3 o más en el Pfeiffer.',
     o:si_no},
    {q:'7. Dependencia severa',
     hint:'Karnofsky menor de 50 o Barthel menor de 20, establecido por datos clínicos de la anamnesis.',
     o:si_no},
    {q:'8. Síndromes geriátricos',
     hint:'Dos o más síndromes geriátricos, recurrentes o persistentes, entre: caídas, úlceras por presión, disfagia, delirium e infecciones a repetición.',
     o:si_no},
    {q:'9. Síntomas persistentes',
     hint:'Dos o más síntomas persistentes o refractarios entre dolor, debilidad, anorexia, disnea o síntomas digestivos, verificados con una lista de chequeo de síntomas como el ESAS.',
     o:si_no},
    {q:'10. Distrés emocional',
     hint:'Distrés o trastorno adaptativo severo, con puntuación mayor de 9 en la escala de Detección de Malestar Emocional.',
     o:si_no},
    {q:'11. Vulnerabilidad social severa',
     hint:'Establecida mediante valoración social y familiar.',
     o:si_no},
    {q:'12. Multimorbilidad',
     hint:'Más de dos enfermedades o condiciones crónicas avanzadas de la lista de indicadores específicos del ítem 14.',
     o:si_no},
    {q:'13. Uso de recursos',
     hint:'Más de 2 ingresos urgentes o no planificados en los últimos 6 meses, o aumento de la demanda o de la intensidad de las intervenciones, como atención domiciliaria o intervenciones de enfermería.',
     o:si_no},

    {q:'14. Indicadores específicos de severidad y progresión por patología',
     hint:'Cumple los criterios de enfermedad avanzada correspondientes a alguna de las condiciones que se detallan a continuación. Despliegue cada una para ver los criterios que la operativizan.',
     criterios:[
      {t:'Criterios generales de enfermedad avanzada',
       d:'Progresión documentada de la enfermedad primaria por valoraciones sucesivas o estudios complementarios. Varias visitas a urgencias u hospitalizaciones en los últimos 6 meses. Demanda creciente de atención en domicilio o institución. Deterioro funcional reciente con Karnofsky de 50 % o menos, o dependencia en al menos 3 de las 6 actividades básicas. Alteración nutricional reciente: pérdida no intencionada de más del 10 % del peso en 6 meses, o albúmina menor de 2,5 g/dL.'},
      {t:'Enfermedad oncológica',
       d:'Enfermedad metastásica o localmente avanzada sin opción de tratamiento con intención curativa, o falta de respuesta o contraindicación al tratamiento oncológico específico. Deterioro funcional con escala funcional paliativa menor del 50 %. Complicaciones como derrame pleural o pericárdico, ascitis maligna o compromiso del sistema nervioso central.'},
      {t:'Insuficiencia cardíaca',
       d:'Disnea grado IV de la NYHA o angina intratable con insuficiencia cardíaca secundaria. Fracción de eyección del 20 % o menor. Persistencia de los síntomas de insuficiencia cardíaca congestiva a pesar de tratamiento adecuado con diuréticos, vasodilatadores e inhibidores de la enzima convertidora de angiotensina. Insuficiencia cardíaca refractaria con arritmias supraventriculares o ventriculares resistentes al tratamiento antiarrítmico.'},
      {t:'Enfermedad pulmonar crónica',
       d:'Enfermedad pulmonar crónica severa con disnea de reposo grado IV del Medical Research Council y respuesta escasa o nula a broncodilatadores. Progresión evidenciada por aumento de hospitalizaciones o visitas domiciliarias por infecciones respiratorias o insuficiencia respiratoria. Hipoxemia con PO2 de 55 mmHg o menos en reposo respirando aire ambiente, o saturación de 88 % o menos con oxígeno suplementario; o hipercapnia con PCO2 de 50 mmHg o más. Insuficiencia cardíaca derecha secundaria a la enfermedad pulmonar. Taquicardia mayor de 100 latidos por minuto en reposo.'},
      {t:'Enfermedad hepática crónica',
       d:'Cirrosis con insuficiencia hepática grado C de la clasificación de Child-Pugh: encefalopatía hepática grado III o IV, ascitis masiva refractaria, bilirrubina mayor de 3 mg/dL, albúmina menor de 2,8 g/dL, tiempo de protrombina menor del 30 %, o síndrome hepatorrenal no tributario de tratamiento médico intensivo. Puntuación MELD mayor de 30. Sin opción de trasplante.'},
      {t:'Enfermedad renal crónica',
       d:'Estadio 5, con tasa de filtrado glomerular de 15 mL/min/1,73 m² o menor, en paciente no candidato a terapia de reemplazo renal ni a trasplante. Síntomas urémicos como confusión, náuseas y vómitos refractarios o prurito generalizado. Diuresis menor de 400 mL al día. Hiperkalemia mayor de 7 mEq/L que no responde al tratamiento. Pericarditis urémica. Sobrecarga de fluidos intratable.'},
      {t:'Demencia avanzada',
       d:'Edad mayor de 70 años. Estadio FAST 7c o superior. Deterioro cognitivo grave con minimental menor de 14. Dependencia absoluta. Complicaciones: infecciones urinarias o respiratorias de repetición, sepsis, o fiebre a pesar de la antibioticoterapia. Disfagia. Desnutrición. Úlceras por presión refractarias grado III o IV.'},
      {t:'Enfermedad cerebrovascular crónica avanzada',
       d:'Secuela de ataque cerebrovascular con discapacidad grave establecida, estado vegetativo persistente o de mínima conciencia. Disfagia persistente con episodios de broncoaspiración. Complicaciones recurrentes y deterioro cognitivo asociado. Ausencia de mejoría tras la fase de rehabilitación.'},
      {t:'Esclerosis lateral amiotrófica y enfermedades de motoneurona',
       d:'Capacidad vital forzada menor del 60 % de la predicha, o disminución rápida mayor del 20 % en 2 a 3 meses. Signos y síntomas clínicos de insuficiencia respiratoria. Debilidad respiratoria que requiere ventilación no invasiva con presión positiva. Declinación nutricional o requerimiento de alimentación enteral. Dolor severo o distrés psicosocial que requiera intervenciones intensivas. Progresión rápida a la parálisis, en 2 a 3 meses, en dos regiones corporales.'},
      {t:'Enfermedad de Parkinson',
       d:'Estadio 4 o 5 de la clasificación de Hoehn y Yahr. Intolerancia o falta de respuesta a la medicación antiparkinsoniana. Reducción de la independencia con necesidad de ayuda en las actividades de la vida diaria. Poca predictibilidad de los periodos "off". Mal control del dolor secundario, la rigidez, las contracturas o las discinesias. Episodios frecuentes de broncoaspiración o disfagia grave.'},
      {t:'VIH y sida',
       d:'Enfermedad avanzada con deterioro funcional progresivo, complicaciones oportunistas recurrentes, falta de respuesta o imposibilidad de continuar la terapia antirretroviral, y comorbilidad asociada al envejecimiento con el virus.'}
     ],
     o:si_no}
  ],
  logic:a=>{
    const sq = a[0]===1;
    const otros = a.slice(1).reduce((n,x)=>n+(x||0),0);
    return (sq && otros>=1)
      ? {t:'NECPAL positivo',tone:'alert',display:'Positivo',
         d:'Pregunta sorpresa positiva y '+otros+' de los 13 parámetros positivo(s). Se identifica como persona con cronicidad avanzada y necesidades paliativas: requiere un abordaje individualizado basado en objetivos, que tenga en cuenta las preferencias y valores de la persona, con seguimiento clínico constante y cercano.'}
      : {t:'NECPAL negativo',tone:'ok',display:'Negativo',
         d: sq ? 'La pregunta sorpresa es positiva pero ninguno de los 13 parámetros lo es. Mantenga el seguimiento y repita la evaluación ante progresión de la enfermedad.'
               : 'La pregunta sorpresa no es positiva, por lo que el instrumento no identifica necesidades paliativas en este momento. Reevalúe ante deterioro funcional, nutricional o nuevos ingresos.'};
  },
  note:'El instrumento identifica necesidades, no pronostica un tiempo de vida. Un NECPAL positivo no equivale a limitación del esfuerzo terapéutico ni a suspender tratamientos específicos, y se propone codificar al paciente como persona con cronicidad avanzada. Los criterios por patología del ítem 14 están operativizados aquí con los criterios de enfermedad avanzada de la National Hospice and Palliative Care Organization, que son los de uso más difundido; el anexo 1 del instrumento oficial es la referencia definitiva para su aplicación formal.'
},

pps:{
  eje:'paliativo', dom:'Necesidades paliativas',
  name:'PPS',
  full:'Escala Funcional Paliativa (Palliative Performance Scale)',
  blurb:'Once categorías descendentes desde el 100 % hasta el 0 %. Modificación de la Escala de Karnofsky para el paciente en cuidado paliativo.',
  max:null,
  ref:'Vila-Arias J, Pereira S, López E, Guzmán J, Sanmartín J. Utilidad del Palliative Performance Scale v2 para la estimación de supervivencia en enfermos con cáncer avanzado. Med Paliat. 2012;19(4):133-8.',
  items:[
    {q:'Seleccione el nivel que mejor describe al paciente',
     hint:'Valore de arriba hacia abajo cinco dimensiones: deambulación, actividad y evidencia de enfermedad, autocuidado, ingesta y nivel de conciencia. Elija el nivel en el que la persona encaja de forma global.',
     o:[
      {l:'100 % · Deambulación normal, sin evidencia de enfermedad, autocuidado completo, ingesta normal, alerta',v:100},
      {l:'90 % · Deambulación normal, alguna evidencia de enfermedad, autocuidado completo, ingesta normal, alerta',v:90},
      {l:'80 % · Deambulación normal, actividad normal con esfuerzo, autocuidado completo, ingesta normal o reducida, alerta',v:80},
      {l:'70 % · Deambulación reducida, imposible trabajar, autocuidado completo, ingesta normal o reducida, alerta',v:70},
      {l:'60 % · Deambulación reducida, incapaz para pasatiempos o trabajos domésticos, asistencia ocasional, alerta o confusión mental',v:60},
      {l:'50 % · Sillón o cama, incapaz para cualquier trabajo, asistencia considerable, alerta o confusión mental',v:50},
      {l:'40 % · Fundamentalmente en cama, fundamentalmente asistido, ingesta normal o reducida, somnolencia o confusión',v:40},
      {l:'30 % · Encamado 100 %, completamente dependiente, ingesta reducida, somnolencia o confusión',v:30},
      {l:'20 % · Encamado 100 %, completamente dependiente, ingesta a sorbos, somnolencia o confusión',v:20},
      {l:'10 % · Encamado 100 %, completamente dependiente, solo cuidados de boca, somnolencia o coma',v:10},
      {l:'0 % · Muerto',v:0}
     ]}
  ],
  logic:a=>{
    const v = a[0];
    if(v===undefined) return {t:'Sin dato',tone:'ok',display:'—',d:''};
    if(v===0)   return {t:'Fallecido',tone:'alert',display:'0 %',d:'Categoría terminal de la escala.'};
    if(v<=30)   return {t:'Deterioro funcional muy avanzado',tone:'alert',display:v+' %',d:'Paciente encamado y completamente dependiente. Priorice control de síntomas, cuidados de confort, acompañamiento familiar y planificación anticipada de las decisiones. Este rango puntúa 4 puntos en el Índice Pronóstico Paliativo.'};
    if(v<=50)   return {t:'Deterioro funcional significativo',tone:'alert',display:v+' %',d:'Un PPS menor del 50 % es criterio de deterioro funcional significativo en el bloque oncológico del NECPAL. Este rango puntúa 2,5 puntos en el Índice Pronóstico Paliativo.'};
    if(v<=70)   return {t:'Deterioro funcional moderado',tone:'warn',display:v+' %',d:'Deambulación reducida con autocuidado aún conservado. Anticipe necesidades de apoyo y revise objetivos de cuidado. Este rango puntúa 0 puntos en el Índice Pronóstico Paliativo.'};
    return {t:'Funcionalidad conservada',tone:'ok',display:v+' %',d:'Deambulación y autocuidado normales. Utilice mediciones seriadas: la escala es especialmente útil para detectar el declive progresivo en el tiempo.'};
  },
  note:'Su valor principal es el seguimiento seriado: permite medir el declinar progresivo del paciente paliativo más que definir una conducta en una única medición.'
},

                   : {t:'No alcanza los umbrales pronósticos',tone:'warn',d:'El índice no alcanza los puntos de corte de 4 ni de 6. Mantenga el seguimiento seriado, dado que la trayectoria puede cambiar en pocos días.'},

                     : {t:'Riesgo muy alto',tone:'alert',d:'Mortalidad a 4 años cercana al 64 %. Revise activamente qué intervenciones preventivas pueden suspenderse y oriente el plan a objetivos centrados en la persona.'},

  items:[
    {q:'Califique el tono muscular del grupo explorado',
     hint:'La espasticidad es un aumento del tono dependiente de la velocidad, por lo que la exploración debe realizarse con máxima aceleración en el arco de movilidad.',
     o:[
      {l:'0 · Sin aumento del tono',v:0},
      {l:'1 · Resistencia mínima al final del rango de movimiento',v:1},
      {l:'1+ · Resistencia mínima en menos del 50 % del rango de movimiento',v:1.5},
      {l:'2 · Aumento del tono en la mayoría del arco de movilidad; el movimiento pasivo es fácil',v:2},
      {l:'3 · Aumento considerable del tono; el movimiento pasivo es difícil',v:3},
      {l:'4 · Rigidez en flexión o extensión',v:4}
     ]}
  ],
  logic:a=>{
    const v=a[0], lbl={0:'0',1:'1',1.5:'1+',2:'2',3:'3',4:'4'}[v];
    if(v===0)   return {t:'Tono muscular normal',tone:'ok',display:lbl,d:'Sin aumento del tono en el grupo explorado.'};
    if(v<=1.5)  return {t:'Espasticidad leve',tone:'warn',display:lbl,d:'Resistencia mínima. Evalúe si interfiere con la higiene, el vestido, los traslados o el posicionamiento en sedente, y defina las pautas de tratamiento.'};
    if(v===2)   return {t:'Espasticidad moderada',tone:'warn',display:lbl,d:'Aumento del tono en la mayoría del arco de movilidad. Ajuste las pautas de tratamiento y coordine con rehabilitación.'};
    if(v===3)   return {t:'Espasticidad severa',tone:'alert',display:lbl,d:'El movimiento pasivo es difícil. Sin modulación a largo plazo puede producir deformidades musculoesqueléticas, como mano en garra o pie equino.'};
    return {t:'Rigidez',tone:'alert',display:lbl,d:'Rigidez en flexión o extensión. Priorice el manejo del riesgo de deformidad, dolor y lesiones por presión.'};
  },
  note:'Validada en pacientes con ataque cerebrovascular, trauma raquimedular, trauma craneoencefálico y esclerosis múltiple, con confiabilidad inter e intraobservador moderada.'
},

frail:{
  eje:'funcional', dom:'Fragilidad',

  full:'Escala de cribado para fragilidad',
  blurb:'Cinco ítems por interrogatorio. Primer paso de tamización; la confirmación diagnóstica se hace con el fenotipo de Fried o la CFS.',
  max:5,
  ref:'Morley JE, Malmstrom TK, Miller DK. J Nutr Health Aging. 2012;16:601-8. Rosas-Carrasco O, Cruz-Arenas E, Parra-Rodríguez L, García-González AI, Contreras-González LH, Szlejf C. J Am Med Dir Assoc. 2016;17(12):1094-8.',
  items:[
    {q:'Fatiga', hint:'En las últimas 4 semanas, ¿qué tanto se ha sentido cansado?',
     o:[{l:'Todo el tiempo',v:1},{l:'La mayor parte del tiempo',v:1},{l:'Algo de tiempo',v:0},{l:'Muy poco tiempo',v:0},{l:'Nada de tiempo',v:0}]},
    {q:'Resistencia', hint:'Usted solo, sin ningún auxiliar como bastón o andadera, ¿tiene dificultad para subir 10 escalones?',
     o:si_no},
    {q:'Deambulación', hint:'Usted solo, sin ningún auxiliar, ¿tiene dificultad para caminar 100 metros (dos cuadras) sin descansar?',
     o:si_no},
    {q:'Enfermedades', type:'multi', score:'threshold', min:5,
     hint:'¿Algún médico le ha dicho que tiene alguna de estas? Puntúa 1 punto si son 5 o más.',
     chips:['Hipertensión arterial','Diabetes','Cáncer (excepto piel no melanoma)','Enfermedad pulmonar crónica','Cardiopatía isquémica','Insuficiencia cardiaca congestiva','Angina','Asma','Artritis (osteoartrosis o artritis reumatoide)','Enfermedad vascular cerebral','Enfermedad renal crónica']},
    {q:'Pérdida de peso', type:'weight', hint:'Puntúa 1 punto si la pérdida en el último año es del 5 % o más.',

  ],

                      : {t:'Sospecha de fragilidad',tone:'alert',d:'Confirme el diagnóstico con el fenotipo de Fried o la Clinical Frailty Scale, idealmente en escenario ambulatorio. Intervención multidimensional: ajustar el tratamiento de enfermedades concomitantes, ejercicio multicomponente, valoración nutricional y revisión de fármacos.'}
},

fried:{
  eje:'funcional', dom:'Fragilidad',
  name:'Fenotipo de Fried',
  full:'Fenotipo de fragilidad de Linda Fried',
  blurb:'Cinco componentes medidos, no solo interrogados. Confirmación diagnóstica en el paciente clínicamente estable en escenario ambulatorio.',
  max:5,
  ref:'Fried LP, et al. J Gerontol A Biol Sci Med Sci. 2001;56(3):M146-56. Puntos de corte para Colombia: Samper-Ternent R, Reyes-Ortiz C, Ottenbacher KJ, Cano CA. Frailty and sarcopenia in Bogotá: results from the SABE Bogotá Study. Aging Clin Exp Res. 2017;29(2):265-72.',
  items:[
    {q:'Pérdida de peso', type:'weight',
     hint:'Pérdida involuntaria en el último año mayor de 4,5 kg o mayor del 5 % del peso previo.',
     o:[{l:'Sí cumple el criterio',v:1},{l:'No cumple el criterio',v:0}]},
    {q:'Baja energía y resistencia',
     hint:'Respuesta afirmativa a alguna de estas dos preguntas de la escala CES-D, considerando afirmativa la respuesta "moderada cantidad de tiempo" (3 a 4 días) o "la mayor parte del tiempo": ¿sentía que todo lo que hacía suponía un esfuerzo en la última semana?, ¿sentía que no podía ponerse en marcha la última semana?',
     o:si_no},
    {q:'Fuerza prensora baja',
     hint:'Medida con dinamómetro y estratificada por sexo e IMC (quintil inferior). Hombres: IMC ≤24, ≤29 kg; IMC 24,1-26, ≤30 kg; IMC 26,1-28, ≤30 kg; IMC >28, ≤32 kg. Mujeres: IMC ≤23, ≤17 kg; IMC 23,1-26, ≤17,3 kg; IMC 26,1-29, ≤18 kg; IMC >29, ≤21 kg.',
     o:si_no},
    {q:'Velocidad de la marcha baja',
     hint:'Tiempo en andar 15 pasos (4,6 metros), estratificado por altura y sexo (quintil inferior). Hombres: altura ≤173 cm, más de 7 s; altura >173 cm, más de 6 s. Mujeres: altura ≤159 cm, 7 s o más; altura >159 cm, 6 s o más.',
     o:si_no},
    {q:'Bajo nivel de actividad física',
     hint:'Kilocalorías gastadas por semana según el Minnesota Leisure Time Activity Questionnaire, quintil inferior: hombres menos de 383 kcal/semana, mujeres menos de 270 kcal/semana.',
     o:si_no}
  ],
  interpret:s=> s===0 ? {t:'Robusto',tone:'ok',d:'No cumple ningún criterio del fenotipo. Mantenga ejercicio multicomponente y adecuado aporte proteico.'}
             : s<=2   ? {t:'Prefragilidad',tone:'warn',d:'Estado intermedio y potencialmente reversible. Establezca un plan de intervención con ejercicio, nutrición y revisión farmacológica.'}
                      : {t:'Fragilidad',tone:'alert',d:'Tres o más criterios confirman fragilidad. Establezca un plan de intervención multidimensional e individualizado, y considere el impacto pronóstico en las decisiones terapéuticas.'},
  note:'Para cada población deben estimarse los puntos de corte según las diferencias antropométricas. Ante la dificultad de aplicar el cuestionario de Minnesota, algunos autores han propuesto alternativas como la limitación para caminar media milla.'
},

cfs:{
  eje:'funcional', dom:'Fragilidad',
  name:'Clinical Frailty Scale',
  full:'Clinical Frailty Scale (CFS) versión 2.0',
  blurb:'Escala de 9 puntos que resume el nivel general de condición física o fragilidad. No es un cuestionario: requiere juicio clínico.',
  max:null,
  ref:'Rockwood K, Theou O. Using the Clinical Frailty Scale in allocating scarce health care resources. Can Geriatr J. 2020;23(3):254-9.',
  items:[
    {q:'Seleccione la categoría que mejor describe al paciente',
     hint:'Se enfoca en movilidad, equilibrio, uso de ayudas para caminar y habilidades para comer, vestirse, comprar, cocinar y realizar operaciones bancarias. La puntuación debe coincidir con la descripción, no basarse en imágenes.',
     o:[
      {l:'1 · Muy en forma. Personas sanas, activas, enérgicas y motivadas. Hacen ejercicio regularmente y presentan mejor estado general que la gente de su edad',v:1},
      {l:'2 · En forma. Sin síntomas de enfermedad activa, pero con estado general peor que la categoría anterior. A menudo hacen ejercicio en periodos discontinuos',v:2},
      {l:'3 · Buen manejo. Problemas médicos bien controlados, pero no se muestran regularmente activas más allá de la rutina de caminar',v:3},
      {l:'4 · Vive con fragilidad muy leve. No dependen de terceros, pero los síntomas a menudo limitan las actividades: "ir más despacio" o "estar cansado durante el día"',v:4},
      {l:'5 · Vive con fragilidad leve. Necesitan ayuda en actividades instrumentales (finanzas, transporte, trabajo doméstico pesado, medicamentos) y hay lentitud evidente',v:5},
      {l:'6 · Vive con fragilidad moderada. Necesitan ayuda con todas las actividades externas y el mantenimiento de la casa; problemas con escaleras y ayuda para bañarse',v:6},
      {l:'7 · Vive con fragilidad grave. Completamente dependientes para el cuidado personal por causa física o cognitiva, pero estables y sin alto riesgo de morir en 6 meses',v:7},
      {l:'8 · Vive con fragilidad muy grave. Totalmente dependientes, acercándose al final de la vida; no se recuperan ni de una enfermedad menor',v:8},
      {l:'9 · Situación terminal. Esperanza de vida inferior a 6 meses en personas que no son evidentemente débiles',v:9}
     ]}
  ],
  logic:a=>{
    const v=a[0];
    if(v<=3) return {t:'Robusto',tone:'ok',display:'CFS '+v,d:'Sin criterios de fragilidad. Refuerce la actividad física regular y el control de las condiciones crónicas.'};
    if(v===4) return {t:'Prefragilidad',tone:'warn',display:'CFS 4',d:'Estado potencialmente reversible. Intervenga con ejercicio multicomponente, revisión de fármacos y valoración nutricional.'};
    return {t:'Fragilidad',tone:'alert',display:'CFS '+v,d:'Un puntaje de 5 o más define fragilidad, con mayor riesgo de declive funcional, hospitalización, institucionalización y muerte. Indique valoración geriátrica integral y plan de cuidado individualizado.'};
  },
  note:'Se ha usado como herramienta de clasificación en decisiones clínicas mayores, incluida la asignación de recursos escasos. Por ello se insiste en su uso apropiado y siempre acompañado de juicio clínico.'
},

  note:'Su uso es para búsqueda activa de casos. En el escenario ambulatorio proceda a la confirmación según el algoritmo EWGSOP2, con ejercicio multicomponente e intervención nutricional.'

barthel:{
  eje:'funcional', dom:'ABVD',

  max:100,

  items:[
    {q:'Alimentación',
     o:[{l:'Independiente: capaz de utilizar cualquier instrumento, come en tiempo razonable, desmenuza la comida y extiende la mantequilla por sí solo',v:10},
        {l:'Necesita ayuda, por ejemplo para cortar o extender la mantequilla',v:5},
        {l:'Dependiente: necesita ser alimentado',v:0}]},
    {q:'Lavado (baño)',
     o:[{l:'Independiente: capaz de lavarse entero; entra y sale de la ducha o bañera sin otra persona presente',v:5},

    {q:'Vestido',

    {q:'Deposición',

    {q:'Micción',

        {l:'Incontinente',v:0}]},
    {q:'Uso del sanitario',
     o:[{l:'Independiente: entra y sale solo, se maneja con la ropa y la limpieza, puede usar barras de soporte',v:10},
        {l:'Necesita ayuda para el equilibrio, la ropa o la limpieza',v:5},
        {l:'Dependiente: incapaz de manejarse sin asistencia mayor',v:0}]},
    {q:'Traslado sillón - cama',
     o:[{l:'Independiente: no necesita ayuda; si usa silla de ruedas lo hace solo',v:15},

        {l:'Gran ayuda: se sienta sin ayuda pero requiere mucha asistencia para entrar o salir de la cama',v:5},

        {l:'Independiente en silla de ruedas: propulsa 50 metros y gira esquinas solo',v:5},
        {l:'Dependiente: requiere ayuda mayor',v:0}]},
    {q:'Escalones',
     o:[{l:'Independiente: sube y baja un piso sin ayuda ni supervisión, aunque use barandilla',v:10},
        {l:'Necesita ayuda: supervisión física o verbal',v:5},
        {l:'Dependiente: necesita ascensor o no puede salvar escalones',v:0}]}
  ],
  interpret:s=> s===100 ? {t:'Independiente',tone:'ok',d:'Autonomía completa para las actividades básicas de la vida diaria.'}
             : s>=60    ? {t:'Dependencia leve',tone:'warn',d:'Identifique las actividades comprometidas y compárelas con la situación previa a la enfermedad actual para orientar la rehabilitación y prevenir el deterioro de la movilidad.'}
             : s>=40    ? {t:'Dependencia moderada',tone:'warn',d:'Requiere apoyo estructurado. Defina plan de rehabilitación, necesidad de cuidador y el nivel asistencial más adecuado.'}
             : s>=20    ? {t:'Dependencia grave',tone:'alert',d:'Alto consumo de recursos y riesgo de institucionalización. Evalúe red de apoyo y carga del cuidador. Un Barthel menor de 25 es criterio de severidad funcional en el NECPAL.'}
                        : {t:'Dependencia total',tone:'alert',d:'Dependencia para prácticamente todas las actividades básicas. Priorice el cuidado, la prevención de lesiones por presión y el soporte al cuidador.'},

},

lawton:{
  eje:'funcional', dom:'AIVD',
  name:'Lawton y Brody',
  full:'Actividades instrumentales de la vida diaria',
  blurb:'Ocho actividades instrumentales. Apoya la detección precoz del deterioro funcional en domicilio o institución.',
  max:8,
  ref:'Lawton MP, Brody EM. Gerontologist. 1969;9:179-86. Ministerio de Salud de Colombia. Anexos de tests de valoración integral: instrumentos; 2018.',
  items:[
    {q:'Uso del teléfono',
     o:[{l:'Utiliza el teléfono por iniciativa propia',v:1},{l:'Marca bien unos cuantos números conocidos',v:1},{l:'Contesta el teléfono, pero no marca',v:1},{l:'No utiliza el teléfono',v:0}]},
    {q:'Compras',

    {q:'Cuidado de la casa',

    {q:'Lavado de ropa',

pfeffer:{

eq5d:{
  eje:'funcional', dom:'Calidad de vida',
  name:'EuroQol-5D-5L',
  full:'Cuestionario de calidad de vida relacionada con la salud',
  blurb:'Cinco dominios con respuesta tipo Likert de 5 opciones. Se indaga por la percepción de salud de hoy.',
  max:null,
  ref:'Ramos Goñi J, Pinto Prades J, Oppe M, Cabasés Hita J, Rivero-Arias O. Estimación del conjunto de valores para los estados de salud del EQ-5D-5L basados en las preferencias de la población española. Madrid: Ministerio de Sanidad, Política Social e Igualdad; 2014. Normas poblacionales colombianas: Bailey HH, Janssen MF, Varela RO, Moreno JA. Value Health Reg Issues. 2021;26:24-32.',
  scaleOpts:[
    {l:'0 · Sin problemas',v:0},
    {l:'1 · Problemas leves',v:1},
    {l:'2 · Problemas moderados',v:2},
    {l:'3 · Problemas severos',v:3},
    {l:'4 · Incapaz o con problemas extremos',v:4}
  ],
  qs:['Movilidad','Autocuidado','Actividades cotidianas','Dolor o malestar','Ansiedad o depresión'],
  extraItems:[
    {q:'Escala visual análoga: su salud HOY', type:'num', key:'eva',
     hint:'La escala está numerada de 0 a 100. 100 representa la mejor salud que usted se pueda imaginar y 0 la peor salud que usted se pueda imaginar.',
     label:'Salud hoy (0 a 100)'}
  ],
  logic:a=>{
    const perfil = a.slice(0,5).map(x=>x===undefined?'-':x).join('');
    const suma = a.slice(0,5).reduce((n,x)=>n+(x||0),0);
    const eva = STATE_EXTRA('eva');
    const evaTxt = eva!=='' && eva!==undefined ? '\nEscala visual análoga: '+eva+'/100.' : '';
    if(suma===0) return {t:'Sin problemas en los cinco dominios',tone:'ok',display:perfil,
      d:'El perfil 00000 indica ausencia de problemas en la calidad de vida referida.'+evaTxt};
    if(suma<=5)  return {t:'Afectación leve',tone:'warn',display:perfil,
      d:'Perfil '+perfil+'. Contraste el perfil con la escala visual análoga y con la evolución en el tiempo, más que con un valor único.'+evaTxt+'\nEvalúe y aborde condiciones asociadas: revise medicamentos potencialmente inapropiados, evalúe y controle el dolor, y estabilice las condiciones médicas activas.'};
    if(suma<=12) return {t:'Afectación moderada',tone:'warn',display:perfil,
      d:'Perfil '+perfil+'. Identifique cuáles dominios pesan más en la percepción del paciente para dirigir la intervención.'+evaTxt+'\nEvalúe y aborde condiciones asociadas: revise medicamentos potencialmente inapropiados, evalúe y controle el dolor, y estabilice las condiciones médicas activas.'};
    return {t:'Afectación severa',tone:'alert',display:perfil,
      d:'Perfil '+perfil+'. Un perfil próximo a 44444 refleja una afectación severa de la calidad de vida.'+evaTxt+'\nPriorice el control del dolor, la revisión farmacológica y la estabilización de las condiciones médicas activas.'};
  },
  note:'La unión de los cinco dígitos genera un perfil de salud: 00000 corresponde a ausencia de problemas y 44444 a una afectación severa. El perfil se contrasta con la puntuación de la escala visual análoga.'
},

cam:{
  eje:'mental', dom:'Delirium',
  name:'CAM',
  full:'Confusion Assessment Method',
  blurb:'Tamización rápida de delirium. Se aplica antes de cualquier prueba cognoscitiva.',
  max:null,
  ref:'Inouye SK, van Dyck CH, Alessi CA, Balkin S, Siegal AP, Horwitz RI. Ann Intern Med. 1990;113(12):941-8. Toro AC, Escobar LM, Franco JG, Díaz-Gómez JL, Muñoz JF, Molina F, et al. Med Intensiva. 2010;34(1):14-21.',
  items:[
    {q:'1. Inicio agudo y curso fluctuante', hint:'¿Hay evidencia de cambio agudo en el estado mental basal del paciente? ¿La conducta fluctúa a lo largo del día, va y viene, o cambia en severidad?',
     o:pres},
    {q:'2. Falta de atención', hint:'¿Tiene dificultad para atender, se distrae fácilmente o le cuesta mantener el hilo de lo que venía diciendo?',
     o:pres},
    {q:'3. Pensamiento desorganizado', hint:'¿El lenguaje es desorganizado o incoherente, la conversación poco clara o con ideas ilógicas, fuga de ideas o cambios impredecibles de tema?',
     o:pres},
    {q:'4. Nivel de conciencia alterado', hint:'Cualquier nivel distinto de alerta: vigilante (hiperalerta), letárgico (fácilmente despertable), estuporoso (difícil de despertar) o comatoso (no se puede despertar).',
     o:[{l:'Presente',v:1},{l:'Ausente (alerta, normal)',v:0}]}
  ],
  logic:a=>{
    const n = a.reduce((s,x)=>s+(x||0),0);
    if(a[0]===1 && a[1]===1 && (a[2]===1 || a[3]===1))
      return {t:'Delirium',tone:'alert',display:'Positivo',
        d:'Se cumplen los criterios 1 y 2 más al menos uno de los criterios 3 o 4. Prevenga y maneje complicaciones, evalúe y trate los factores modificables, revise los fármacos, mantenga la seguridad y el confort del paciente y trabaje en restaurar la función.'};
    if(n>=1)
      return {t:'Delirium subsindrómico',tone:'warn',display:'Parcial',
        d:'Hay criterios presentes pero no se completa el patrón diagnóstico. El delirium subsindrómico también se asocia a peores desenlaces: refuerce las medidas de prevención, revise fármacos y factores precipitantes, y revalore en otro momento del día.'};
    return {t:'Sin delirium',tone:'ok',display:'Negativo',
      d:'No se identifican criterios. El delirium es fluctuante: revalore en otro momento del día si la sospecha clínica persiste, y mantenga las medidas de prevención.'};
  },
  note:'Aplique el CAM antes de cualquier prueba cognoscitiva: un delirium no reconocido invalida la interpretación del tamizaje cognitivo.'
},

at4:{
  eje:'mental', dom:'Delirium',
  name:'4AT',
  full:'4AT: prueba rápida de cribado de delirium',
  blurb:'Cuatro ítems en menos de dos minutos. No requiere entrenamiento y es aplicable en el paciente somnoliento o que no colabora, situación en la que el CAM no puede completarse.',
  max:12,
  external:true,
  ref:'Bellelli G, Morandi A, Davis DHJ, Mazzola P, Turco R, Gentile S, et al. Validation of the 4AT, a new instrument for rapid delirium screening: a study in 234 hospitalised older people. Age Ageing. 2014;43(4):496-502. Versión española validada: Delgado-Parada E, Morillo-Cuadrado D, Saiz-Ruiz J, Cebollada-Gracia A, Ayuso-Mateos JL, Cruz-Jentoft AJ. Diagnostic accuracy of the Spanish version of the 4AT scale (4AT-ES) for delirium screening in older inpatients. Eur J Psychiatry. 2022. doi:10.1016/j.ejpsy.2022.01.003. Escala complementaria: no forma parte del manual de referencia.',
  items:[
    {q:'1. Estado de alerta',
     hint:'Incluye tanto al paciente muy somnoliento (por ejemplo, difícil de despertar) como al agitado o hiperactivo. Observe al paciente; si está dormido, intente despertarlo hablándole o tocándole suavemente el hombro. Pídale que diga su nombre y su dirección para orientar la valoración.',
     o:[{l:'Normal: completamente alerta y no agitado durante toda la evaluación',v:0},
        {l:'Somnolencia leve durante menos de 10 segundos tras despertar, luego normal',v:0},
        {l:'Claramente anormal: muy somnoliento, estuporoso o agitado e hiperactivo',v:4}]},
    {q:'2. AMT4 · cuatro preguntas de orientación',
     hint:'Pregunte por la edad, la fecha de nacimiento, el lugar (nombre del hospital o del edificio) y el año actual.',
     o:[{l:'Ningún error',v:0},{l:'1 error',v:1},{l:'2 o más errores, o no evaluable',v:2}]},
    {q:'3. Atención · meses del año en orden inverso',
     hint:'Diga: "Por favor, dígame los meses del año hacia atrás, empezando por diciembre". Si es necesario, ayude con una indicación: "¿cuál es el mes anterior a diciembre?".',
     o:[{l:'Enumera 7 meses o más correctamente',v:0},
        {l:'Comienza pero enumera menos de 7 meses, o rehúsa empezar',v:1},
        {l:'No evaluable: no puede empezar porque se encuentra mal, somnoliento o desatento',v:2}]},
    {q:'4. Cambio agudo o curso fluctuante',
     hint:'Evidencia de cambio significativo o de fluctuación en el estado de alerta, la cognición u otra función mental (por ejemplo, paranoia o alucinaciones) que haya aparecido en las últimas 2 semanas y siga presente en las últimas 24 horas.',
     o:[{l:'No',v:0},{l:'Sí',v:4}]}
  ],
  interpret:s=> s>=4 ? {t:'Posible delirium con o sin deterioro cognitivo',tone:'alert',d:'Un puntaje de 4 o más sugiere delirium, con o sin deterioro cognitivo de base. Confirme con los criterios del DSM 5-TR, busque y trate los factores precipitantes, revise los fármacos, mantenga la seguridad y el confort, y trabaje en restaurar la función.'}
             : s>=1 ? {t:'Posible deterioro cognitivo',tone:'warn',d:'Un puntaje de 1 a 3 sugiere deterioro cognitivo, habitualmente crónico. El delirium no queda descartado: si el ítem 4 no pudo valorarse con información fiable, revalore en otro momento del día. Complete la valoración cognoscitiva de forma programada.'}
                    : {t:'Delirium o deterioro cognitivo grave poco probables',tone:'ok',d:'Un puntaje de 0 hace poco probable el delirium o un deterioro cognitivo grave, pero no los descarta: el delirium sigue siendo posible si la información del ítem 4 es incompleta. Repita el cribado ante cualquier cambio clínico.'},
  note:'A diferencia del CAM, el 4AT no requiere entrenamiento formal y puede completarse en el paciente somnoliento o que no colabora, porque la imposibilidad de evaluar puntúa en lugar de invalidar la prueba. En la validación original mostró sensibilidad del 89,7 % y especificidad del 84,1 %; la versión española alcanzó sensibilidad del 96 % y especificidad del 83,1 %. Es una prueba de cribado: el diagnóstico se confirma con los criterios del DSM 5-TR.'
},

dsmdelirium:{
  eje:'mental', dom:'Delirium',
  name:'Criterios DSM 5-TR · delirium',
  full:'Criterios diagnósticos para delirium del DSM 5-TR',
  blurb:'Confirmación diagnóstica tras un tamizaje positivo. Los cinco criterios deben cumplirse.',
  max:null,
  ref:'American Psychiatric Association. Diagnostic and statistical manual of mental disorders: fifth edition, text revision (DSM 5-TR). Washington; 2022.',
  items:[
    {q:'1. Alteración en la atención acompañada de conciencia reducida del entorno',
     hint:'Capacidad reducida para dirigir, enfocar, mantener y cambiar la atención.', o:pres},
    {q:'2. Desarrollo en un breve periodo, con cambio respecto al basal y fluctuación',
     hint:'Por lo general de horas a unos pocos días; representa un cambio respecto a la atención y la conciencia de referencia y tiende a fluctuar en severidad durante el transcurso de un día.', o:pres},
    {q:'3. Alteración adicional en la cognición',
     hint:'Por ejemplo déficit de memoria, desorientación, lenguaje, capacidad visuoespacial o percepción.', o:pres},
    {q:'4. No se explica mejor por otro trastorno neurocognoscitivo ni ocurre en coma',
     hint:'Las alteraciones no se explican mejor por otro trastorno neurocognitivo preexistente, establecido o en evolución, y no se producen en el contexto de un nivel de excitación gravemente reducido.', o:pres},
    {q:'5. Evidencia de una causa fisiológica directa',
     hint:'Historia clínica, examen físico o hallazgos de laboratorio que indiquen que es consecuencia fisiológica directa de otra condición médica, intoxicación o abstinencia de sustancias, exposición a una toxina, o etiologías múltiples.', o:pres}
  ],
  logic:a=>{
    const n=a.reduce((s,x)=>s+(x||0),0);
    if(n===5) return {t:'Cumple criterios de delirium',tone:'alert',display:'5 / 5',
      d:'Especifique si es agudo (horas o días) o persistente (semanas o meses), y si es hiperactivo, hipoactivo o de nivel mixto de actividad. Recuerde que la forma hipoactiva es la más frecuente y la que con más facilidad pasa desapercibida.'};
    return {t:'No cumple todos los criterios',tone:'warn',display:n+' / 5',
      d:'Faltan '+(5-n)+' criterio(s). Reevalúe en otro momento del día, complete el estudio etiológico y considere el delirium subsindrómico, que también se asocia a peores desenlaces.'};
  }
},

  interpret:s=> s>=19 ? {t:'Sugestivo de deterioro cognoscitivo',tone:'alert',d:'Si la prueba se realiza al familiar y al paciente y ambos superan 19, el resultado es más significativo. Si el familiar puntúa por encima de 19 y el paciente por debajo, considere anosognosia. Correlacione con la tamización cognoscitiva, la escolaridad y los criterios diagnósticos.'}
                      : {t:'No sugestivo de deterioro cognoscitivo',tone:'ok',d:'No alcanza el punto de corte. Si el paciente puntúa por encima de 19 y el familiar por debajo, descarte depresión en el paciente.'},
  note:'Lea la pregunta tal como está en el enunciado y registre siempre a quién se aplicó: paciente o familiar.'

cdr:{
  eje:'mental', dom:'Estadificación',
  name:'CDR',
  full:'Índice clínico de demencia (Clinical Dementia Rating)',
  blurb:'Entrevista semiestructurada al paciente y a un informante confiable. Seis áreas calificadas de 0 a 3.',
  max:null,
  ref:'Hughes CP, Berg L, Danziger WL, Coben LA, Martin RL. A new clinical scale for the staging of dementia. Br J Psychiatry. 1982;140:566-72.',
  scaleOpts:[
    {l:'0 · Ninguno',v:0},
    {l:'0,5 · Cuestionable',v:0.5},
    {l:'1 · Deterioro leve',v:1},
    {l:'2 · Deterioro moderado',v:2},
    {l:'3 · Deterioro severo',v:3}
  ],
  qs:[
    'Memoria — 0: sin pérdida o un olvido esporádico. 0,5: leve olvido persistente, recuerdo parcial de eventos, olvido benigno. 1: pérdida moderada, más marcada para eventos recientes, que interfiere con las actividades cotidianas. 2: pérdida severa, solo retiene material muy aprendido, pérdida rápida de material nuevo. 3: solo quedan fragmentos',
    'Orientación — 0: completamente orientado. 0,5: orientado salvo leve dificultad con relaciones temporales. 1: dificultad moderada con relaciones temporales, orientado en lugar y momento de la evaluación, puede desorientarse en otro lugar. 2: dificultad severa con relaciones temporales, generalmente desorientado en tiempo y con frecuencia en lugar. 3: orientado solamente en persona',
    'Juicio y solución de problemas — 0: soluciona problemas cotidianos, maneja bien negocios y finanzas. 0,5: leve deterioro en solución de problemas, semejanzas y diferencias. 1: dificultad moderada, juicio social conservado. 2: deterioro severo, juicio social generalmente deteriorado. 3: incapaz de realizar juicios o solucionar problemas',
    'Actividades sociales — 0: funcionamiento independiente y en el nivel habitual en trabajo, compras y grupos sociales. 0,5: leve deterioro en estas actividades. 1: incapaz de funcionar independientemente, aunque todavía puede estar involucrado; aparenta normalidad a simple vista. 2: sin pretensión de función independiente fuera del hogar, aparenta estar suficientemente bien para llevarse a actividades fuera. 3: demasiado enfermo como para llevarse a actividades fuera del hogar',
    'Hogar y pasatiempos — 0: vida hogareña, pasatiempos e intereses intelectuales conservados. 0,5: deterioro leve. 1: deterioro leve pero definitivo; se abandonan las tareas domésticas difíciles y los intereses complejos. 2: solo se conservan quehaceres simples, intereses muy restringidos y pobremente conservados. 3: no hay funcionamiento significativo dentro del hogar',
    'Cuidado personal — 0: completamente capaz de cuidar de sí mismo. 0,5: completamente capaz. 1: necesita recordatorios. 2: requiere asistencia para vestirse, higiene y cuidado de sus efectos personales. 3: requiere mucha ayuda, incontinencia frecuente'
  ],
  logic:a=>{
    const M=a[0], sec=a.slice(1).filter(x=>x!==undefined);
    if(M===undefined) return {t:'Incompleto',tone:'warn',display:'—',d:'Califique las seis áreas.'};
    const moda=arr=>{const c={};arr.forEach(x=>c[x]=(c[x]||0)+1);
      return Number(Object.keys(c).sort((x,y)=>c[y]-c[x]||Math.abs(x-M)-Math.abs(y-M))[0]);};
    const iguales=sec.filter(x=>x===M).length;
    const arriba=sec.filter(x=>x>M), abajo=sec.filter(x=>x<M);
    let cdr=M;
    if(iguales<3){
      if(arriba.length>3) cdr=moda(arriba);
      else if(abajo.length>3) cdr=moda(abajo);
    }
    const lbl=v=>({0:'0',0.5:'0,5',1:'1',2:'2',3:'3'})[v];
    const txt='CDR global '+lbl(cdr)+'. La memoria tiene prioridad para determinar el estadio: si al menos otras tres áreas se califican igual que la memoria, ella define el estadio; si más de tres categorías quedan por encima o por debajo, predomina la puntuación de aquellas.';
    if(cdr===0)   return {t:'Normal',tone:'ok',display:'0',d:txt};
    if(cdr===0.5) return {t:'Deterioro cognitivo leve',tone:'warn',display:'0,5',d:txt+'\nDefina el seguimiento y complemente el estudio etiológico.'};
    if(cdr===1)   return {t:'Demencia leve',tone:'warn',display:'1',d:txt+'\nInicie la planificación compartida de la atención mientras la persona conserva capacidad para expresar sus preferencias.'};
    if(cdr===2)   return {t:'Demencia moderada',tone:'alert',display:'2',d:txt+'\nRevise objetivos de tratamiento, carga del cuidador y síntomas neuropsiquiátricos.'};
    return {t:'Demencia grave',tone:'alert',display:'3',d:txt+'\nCentre los objetivos en confort, prevención de complicaciones y soporte al cuidador; revise criterios de necesidad paliativa.'};
  },
  note:'El estadio orienta los objetivos de tratamiento y permite iniciar la planificación compartida de la atención que el paciente desea recibir a lo largo de su vida.'
},

gdsreisberg:{
  eje:'mental', dom:'Estadificación',
  name:'GDS de Reisberg',
  full:'Global Deterioration Scale',
  blurb:'Siete estadios desde el envejecimiento normal hasta el trastorno neurocognoscitivo mayor de causa neurodegenerativa.',
  max:null,
  ref:'Reisberg B, Ferris SH, de León MJ, Crook T. The global deterioration scale for assessment of primary degenerative dementia. Am J Psychiatry. 1982;139:1136-9.',
  items:[
    {q:'Seleccione el estadio que mejor describe las características clínicas de la persona',
     o:[
      {l:'GDS 1 · Normal. No existe deterioro cognitivo subjetivo ni objetivo',v:1},
      {l:'GDS 2 · Muy leve. Quejas subjetivas de déficit de memoria (olvido de objetos, nombres y citas). No se objetiva el déficit en el examen clínico ni en el entorno sociolaboral. Es consciente de sus síntomas',v:2},
      {l:'GDS 3 · Leve. Primeros defectos claros: desorientación espacial, bajo rendimiento laboral, dificultad para recordar nombres evidente para los familiares, escasa retención tras la lectura, olvido de la ubicación de objetos de valor, déficit de concentración evidente para el clínico. Ansiedad leve o moderada; se inicia la negación',v:3},
      {l:'GDS 4 · Moderado. Olvido de hechos cotidianos o recientes, déficit en el recuerdo de su historia personal, dificultad en la resta de 7 en 7, incapacidad para planificar viajes o finanzas. Suele conservar orientación en tiempo y persona y el reconocimiento de caras familiares. Labilidad afectiva y negación',v:4},
      {l:'GDS 5 · Moderadamente grave. Necesita asistencia en determinadas tareas (elegir la ropa), no en el aseo ni en la comida. Incapaz de recordar aspectos importantes de su vida cotidiana. Cierta desorientación en tiempo o lugar. Sabe su nombre y el de su pareja e hijos',v:5},
      {l:'GDS 6 · Grave. Olvida a veces el nombre de su pareja, de quien depende para vivir. Desorientación temporoespacial. Puede necesitar asistencia para las actividades de la vida diaria y presentar incontinencia. Ritmo diurno alterado. Cambios de personalidad y afectividad',v:6},
      {l:'GDS 7 · Muy grave. Pérdida progresiva de todas las capacidades verbales, incontinencia urinaria, necesidad de asistencia para higiene y alimentación, pérdida de funciones psicomotoras como la deambulación, signos neurológicos frecuentes',v:7}
     ]}
  ],
  logic:a=>{
    const v=a[0];
    if(v<=2) return {t:'Sin deterioro objetivable',tone:'ok',display:'GDS '+v,d:'No se objetiva déficit en el examen clínico ni en el entorno sociolaboral. Defina seguimiento si la queja subjetiva persiste.'};
    if(v===3) return {t:'Deterioro leve',tone:'warn',display:'GDS 3',d:'Primeros defectos claros. Complete el estudio etiológico y considere valoración neuropsicológica.'};
    if(v<=5)  return {t:'Deterioro moderado',tone:'alert',display:'GDS '+v,d:'Plantee objetivos de tratamiento, evalúe síntomas neuropsiquiátricos con el NPI y valore la carga del cuidador. Inicie o continúe la planificación compartida de la atención.'};
    return {t:'Deterioro grave',tone:'alert',display:'GDS '+v,d:'Los estadios 6c a 7 son criterios de severidad en el bloque de demencia del NECPAL. Centre los objetivos en confort, prevención de complicaciones y soporte al cuidador.'};
  },
  note:'Muestra una correlación adecuada con el índice clínico de demencia (CDR).'
},

npi:{
  eje:'mental', dom:'Síntomas neuropsiquiátricos',
  name:'NPI',
  full:'Inventario Neuropsiquiátrico: cuestionario para acompañante',
  blurb:'Entrevista al cuidador principal. Más del 90 % de las personas con demencia desarrollan al menos un síntoma neuropsiquiátrico en cinco años.',
  max:33,
  ref:'Cummings JL, et al. Neurology. 1994;44(12):2308-14. Rothenberg KG. Assessment and management of psychiatric symptoms in neurodegenerative disorders. En: Tousi B, Cummings J, eds. Neuro-geriatrics: a clinical manual. Cham: Springer; 2017. p. 367-88.',
  scaleOpts:[
    {l:'Ausente',v:0},
    {l:'Presente · leve',v:1},
    {l:'Presente · moderado',v:2},
    {l:'Presente · severo',v:3}
  ],
  qs:[
    'Delirios: ¿cree el paciente que otras personas le están robando o que planean hacerle daño?',
    'Alucinaciones: ¿actúa el paciente como si oyera voces? ¿Habla con personas que no están presentes?',
    'Agitación o agresividad: ¿es el paciente terco o testarudo y resiste la ayuda de otros?',
    'Depresión o disforia: ¿actúa el paciente como si estuviera triste o con el ánimo bajo? ¿Llora?',
    'Ansiedad: ¿se molesta cuando se separa de usted? ¿Muestra nerviosismo, falta de aire, suspiros, incapacidad de relajarse o tensión excesiva?',
    'Euforia o exaltación: ¿parece sentirse demasiado bien o actúa excesivamente alegre?',
    'Apatía o indiferencia: ¿parece menos interesado en sus actividades habituales y en las actividades y planes de los demás?',
    'Desinhibición: ¿parece actuar impulsivamente, habla con extraños como si los conociera o dice cosas que pudieran herir los sentimientos de los demás?',
    'Irritabilidad o labilidad: ¿se muestra irritable o impaciente? ¿Tiene dificultad para lidiar con retrasos o esperar actividades planeadas?',
    'Trastorno motor: ¿lleva a cabo actividades repetitivas, como dar vueltas por la casa, jugar con botones o enrollar hilos?',
    'Conducta nocturna: ¿le despierta durante la noche, se levanta muy temprano o toma demasiadas siestas durante el día?'
  ],
  interpret:s=> s===0 ? {t:'Sin síntomas neuropsiquiátricos referidos',tone:'ok',d:'No se identificaron síntomas en esta aplicación. Repita el inventario en el seguimiento: los síntomas pueden aparecer en cualquier etapa, incluso en estadios iniciales.'}
             : s<=8   ? {t:'Síntomas de baja intensidad',tone:'warn',d:'Describa el contexto del síntoma (con quién, cómo, dónde, a qué hora). Investigue causas en el paciente: efecto adverso de medicamentos, dolor, condiciones médicas, cambios sensoriales o pobre higiene del sueño.'}
                      : {t:'Síntomas de intensidad significativa',tone:'alert',d:'Los síntomas conductuales y psicológicos se asocian a mayor mortalidad y morbilidad y contribuyen al agotamiento del paciente y de su cuidador. Investigue causas modificables antes de escalar el tratamiento farmacológico y evalúe la carga del cuidador.'},
  note:'No existen puntos de corte ni una interpretación estricta para esta prueba. Su valor está en el seguimiento: permite documentar la eficacia de los tratamientos de estos síntomas.'
},
